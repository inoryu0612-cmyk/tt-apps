.segs{display:flex;gap:4px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}.segs button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}.segs button.on{background:#fff;color:var(--acc2)}
main{max-width:980px;margin:0 auto;padding:8px}
.card{background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}

.sec{padding:4px 10px 8px}.sec h3{font-size:13.5px;margin:8px 0 4px;color:var(--acc2)}.rd{font-size:12px;color:var(--sub);margin:6px 0 2px;font-weight:700}
.tie{border:1px solid var(--line);border-radius:8px;margin:4px 0;overflow:hidden}.tie .h{display:flex;align-items:center;padding:6px 8px;gap:6px;cursor:pointer}
.tie .h .t{flex:1;text-align:right;font-weight:600;font-size:14px}.tie .h .t.r{text-align:left}.tie .h .s{font-weight:800;min-width:46px;text-align:center}.w{color:var(--acc)}
.rubs{display:none;background:#fafbfc;border-top:1px solid var(--line);padding:2px 6px}.tie.open .rubs{display:block}
.m{padding:5px 2px;border-bottom:1px dashed #e7eaee;cursor:pointer}.m:last-child{border:0}.m .l{display:flex;gap:6px;font-size:13.5px;align-items:baseline}.m .l .o{color:var(--sub);font-size:11px;min-width:16px}

input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:6px}
.li{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}.li .c{color:var(--sub);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;margin:2px}.pri{background:var(--acc2);color:#fff}
.sub{font-size:12px;color:var(--sub)}.back{color:var(--acc2);cursor:pointer;font-size:13px;padding:4px 0}
form label{display:block;font-size:12px;color:var(--sub);margin-top:4px}form input,form select,form textarea{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:14px}

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LS='ttdom_user_ties_v1';
let USER=[];try{USER=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){USER=[]}
const CATS=['全て','中学','高校','大学','実業団','一般'],GEN={A:'男女',M:'男子',W:'女子'};
const EVCAT=e=>D.cat[e];
let S={cat:'全て',g:'A',tab:'ev',ev:null,yr:null,q:'',team:null,pcat:'実業団',reg:'全地方',player:null,ty:'全年',rkg:'M'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function allTies(){return D.ties.concat(USER.map(u=>Object.assign({user:1},u)))}
function ties(){return allTies().filter(t=>(S.cat=='全て'||EVCAT(t.e)==S.cat)&&(S.g=='A'||t.g==S.g))}
const RO=['決勝','準決勝','準々決勝','5回戦','4回戦','3回戦','2回戦','1回戦','決勝トーナメント3回戦','決勝トーナメント2回戦','決勝トーナメント1回戦','第2ステージ2回戦','第2ステージ1回戦','リーグ','決勝リーグ','予選リーグ','第1ステージ',''];
const rk=r=>{let i=RO.indexOf(r);return i<0?50:i};
const evLabel=t=>D.evn[t.e]+' '+t.y+(t.s?' '+t.s:'');
function gameLines(g,left){return g.map((x,i)=>(i+1)+'. '+x[0]+'-'+x[1]).join('　')}
function rubHTML(u){const [o,a,b,sa,sb,g]=u;const aw=sa>sb;
 return `<div class="m" onclick="this.classList.toggle('open');event.stopPropagation()"><div class="l"><span class="o">${o}</span><span class="${aw?'w':''}">${esc(a)}</span><b>${sa}ー${sb}</b><span class="${aw?'':'w'}">${esc(b)}</span></div>${g&&g.length?`<div class="gs">${gameLines(g)}</div>`:''}</div>`}
function tieHTML(t,showEv){const aw=t.sa>t.sb;
 return `<div class="tie ${t.user?'user':''}" onclick="this.classList.toggle('open')"><div class="h"><span class="t ${aw?'w':''}">${esc(t.a)}</span><span class="s">${t.sa}ー${t.sb}</span><span class="t r ${aw?'':'w'}">${esc(t.b)}</span></div>
 ${showEv?`<div class="sub" style="padding:0 8px 4px">${esc(evLabel(t))} ${GEN[t.g]} ${esc(t.r||'')}</div>`:''}
 <div class="rubs">${t.u&&t.u.length?t.u.map(rubHTML).join(''):'<div class="sub">個別試合の記録なし（対戦スコアのみ）</div>'}${t.user?`<button class="btn" onclick="editUser(${t.uid});event.stopPropagation()">編集</button><button class="btn" onclick="delUser(${t.uid});event.stopPropagation()">削除</button>`:''}</div></div>`}
function chips(id,list,cur,fn){return `<div class="ych" id="${id}">${list.map(x=>`<button class="${x==cur?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')}</div>`}
function renderEv(){const T=ties();const m=document.getElementById('main');
 if(!S.ev){const evs=Object.keys(D.evn).filter(e=>S.cat=='全て'||EVCAT(e)==S.cat);
  m.innerHTML=evs.map(e=>{const n=T.filter(t=>t.e==e).length;const yrs=[...new Set(D.cov.filter(c=>c.e==e&&c.ties).map(c=>c.y))];
  return `<div class="card"><div class="th" onclick="S.ev='${e}';S.yr=null;render()"><div class="nm">${esc(D.evn[e])}</div><div class="inf">${EVCAT(e)}・団体戦 ${n}対戦・${yrs.join(' / ')||'—'}</div></div></div>`}).join('');return}
 const e=S.ev;const yrs=[...new Set(D.cov.filter(c=>c.e==e).map(c=>c.y))].sort((a,b)=>b-a);if(!S.yr)S.yr=String(yrs.find(y=>T.some(t=>t.e==e&&t.y==y))||yrs[0]);
 let h=`<div class="back" onclick="S.ev=null;render()">← 大会一覧</div><div class="card"><div class="th"><div class="nm">${esc(D.evn[e])}</div><div class="inf">出典: ${esc(D.notes[e]||'卓球レポート')}</div></div>${chips('yc',yrs.map(String),S.yr,'setYr')}`;
 const subs=e=='JL'?['前期','後期']:[''];
 for(const sub of subs){const cv=D.cov.find(c=>c.e==e&&c.y==S.yr&&c.s==sub);
  h+=`<div class="sec">${sub?`<h3 style="font-size:15px">${sub}</h3>`:''}<div class="sub">収録: ${cv?cv.dep:''}　${cv?cv.ties+'対戦 / '+cv.rub+'試合（ゲームスコア'+cv.gs+'）':''}</div>`;
  for(const g of ['M','W']){if(S.g!='A'&&S.g!=g)continue;
   const tt=T.filter(t=>t.e==e&&t.y==S.yr&&t.s==sub&&t.g==g);
   const pl=D.pl.filter(p=>p.ev==e&&p.yr==S.yr&&p.sub==sub&&p.g==g).sort((a,b)=>a.rank-b.rank);
   h+=`<h3>${GEN[g]}団体</h3>`;
   if(pl.length)h+=`<div>${pl.slice(0,8).map(p=>`<span class="chip ${p.rank==1?'gold':''}">${p.rank}位 ${esc(p.name)}</span>`).join('')}</div>`;
   if(!tt.length){h+='<div class="sub">対戦記録なし</div>';continue}
   const rds=[...new Set(tt.map(t=>t.r))].sort((a,b)=>rk(a)-rk(b));
   for(const r of rds){h+=`<div class="rd">${esc(r||'ラウンド不明')}</div>`+tt.filter(t=>t.r==r).map(t=>tieHTML(t)).join('')}}
  h+='</div>'}
 m.innerHTML=h+'</div>'}
function setYr(y){S.yr=+y;render()}
function yearsOf(T){return ['全年',...[...new Set(T.map(t=>t.y))].sort((a,b)=>b-a).map(String)]}
function renderTies(){const T0=ties();const T=T0.filter(t=>(S.ty=='全年'||t.y==S.ty)&&(!S.q||(t.a+t.b+t.u.map(u=>u[1]+u[2]).join('')).includes(S.q)));
 const grp={};for(const t of T){const k=t.e+'|'+t.y+'|'+t.s;(grp[k]=grp[k]||[]).push(t)}
 const ks=Object.keys(grp).sort((a,b)=>b.split('|')[1]-a.split('|')[1]||Object.keys(D.evn).indexOf(a.split('|')[0])-Object.keys(D.evn).indexOf(b.split('|')[0]));
 document.getElementById('main').innerHTML=`<input type="search" placeholder="チーム・選手名で検索" value="${esc(S.q)}" oninput="S.q=this.value;renderTiesDeb()">${chips('ty',yearsOf(T0),String(S.ty),'setTy')}<div class="sub">${T.length}対戦</div>`+
 ks.map(k=>{const L=grp[k];const[e,y,s]=k.split('|');return `<div class="card"><div class="th" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='block'?'none':'block'"><div class="nm">${esc(D.evn[e])} ${y}${s?' '+s:''}</div><div class="inf">${L.length}対戦</div></div><div class="sec" style="display:${S.q?'block':'none'}">${['M','W'].map(g=>{const x=L.filter(t=>t.g==g).sort((a,b)=>rk(a.r)-rk(b.r));return x.length?`<h3>${GEN[g]}</h3>`+x.map(t=>`<div class="rd">${esc(t.r)}</div>`+tieHTML(t)).join(''):''}).join('')}</div></div>`}).join('')}
let deb;function renderTiesDeb(){clearTimeout(deb);deb=setTimeout(()=>{const p=document.activeElement&&document.activeElement.selectionStart;render();const i=document.querySelector('input[type=search]');if(i){i.focus();try{i.setSelectionRange(p,p)}catch(e){}}},250)}
function setTy(y){S.ty=y=='全年'?'全年':+y;render()}
function rubbers(T){const out=[];for(const t of T)for(const u of (t.u||[])){const [o,a,b,sa,sb,g]=u;const aw=sa>sb;out.push({t,o,w:aw?a:b,l:aw?b:a,wt:aw?t.a:t.b,lt:aw?t.b:t.a,wk:aw?t.ak:t.bk,lk:aw?t.bk:t.ak,sw:Math.max(sa,sb),sl:Math.min(sa,sb),g:aw?g:(g||[]).map(x=>[x[1],x[0]])})}return out}
function mHTML(r){return `<div class="m" onclick="this.classList.toggle('open')"><div class="l"><span class="w">${esc(r.w)}<span class="sub">（${esc(r.wt)}）</span></span><b>${r.sw}ー${r.sl}</b><span>${esc(r.l)}<span class="sub">（${esc(r.lt)}）</span></span></div><div class="meta">${esc(evLabel(r.t))} ${GEN[r.t.g]} ${esc(r.t.r)} ${r.o}番</div>${r.g&&r.g.length?`<div class="gs">${gameLines(r.g)}</div>`:''}</div>`}
function renderMt(){const T0=ties();const R=rubbers(T0.filter(t=>S.ty=='全年'||t.y==S.ty)).filter(r=>!S.q||(r.w+r.l+r.wt+r.lt).includes(S.q));
 R.sort((a,b)=>b.t.y-a.t.y||rk(a.t.r)-rk(b.t.r));
 document.getElementById('main').innerHTML=`<input type="search" placeholder="選手・チーム名で検索" value="${esc(S.q)}" oninput="S.q=this.value;renderTiesDeb()">${chips('ty',yearsOf(T0),String(S.ty),'setTy')}<div class="sub">${R.length}試合（勝者を左に表示・タップでゲームスコア）</div><div class="card sec">${R.slice(0,400).map(mHTML).join('')}${R.length>400?'<div class="sub">先頭400件を表示。検索で絞り込んでください。</div>':''}</div>`}
const REGS=['全地方','北海道','東北','関東','北信越','東海','近畿','中国','四国','九州'];
function teamStats(){const st={};for(const t of ties()){for(const[k,me,op]of[[t.ak,t.sa,t.sb],[t.bk,t.sb,t.sa]]){const s=st[k]=st[k]||{w:0,l:0,n:0};s.n++;me>op?s.w++:s.l++}}return st}
function renderPl(){const m=document.getElementById('main');const T=ties();
 if(S.player){const[pn,tk]=S.player.split('||');const tm=D.teams[tk]||{name:tk};const R=rubbers(T).filter(r=>(r.w==pn&&r.wk==tk)||(r.l==pn&&r.lk==tk));
  m.innerHTML=`<div class="back" onclick="S.player=null;render()">← ${esc(tm.name)}</div><div class="card sec"><h3>${esc(pn)}（${esc(tm.name)}）</h3><div class="sub">${R.filter(r=>r.w==pn).length}勝${R.filter(r=>r.l==pn).length}敗</div>${R.map(mHTML).join('')}</div>`;return}
 if(S.team){const tm=D.teams[S.team]||{name:S.team,cat:''};const TT=T.filter(t=>t.ak==S.team||t.bk==S.team).sort((a,b)=>b.y-a.y);
  const ps={};for(const r of rubbers(TT)){for(const[n,k,w]of[[r.w,r.wk,1],[r.l,r.lk,0]]){if(k!=S.team)continue;for(const one of [n]){const p=ps[one]=ps[one]||{w:0,l:0};w?p.w++:p.l++}}}
  const same=Object.values(D.teams).filter(x=>x.name==tm.name&&x.cat==tm.cat).length>1;
  m.innerHTML=`<div class="back" onclick="S.team=null;render()">← チーム一覧</div><div class="card sec"><h3>${esc(tm.name)}</h3><div class="sub">${esc(tm.cat)}${tm.pref?'・'+esc(tm.pref):''}${same?'（同名校あり）':''}</div>
  <div class="rd">選手（団体戦の個人成績）</div>${Object.entries(ps).sort((a,b)=>b[1].w-a[1].w).map(([n,p])=>`<div class="li" onclick="S.player='${esc(n).replace(/'/g,"\\'")}||${esc(S.team)}';render()"><span>${esc(n)}</span><span class="c">${p.w}勝${p.l}敗</span></div>`).join('')||'<div class="sub">個別試合の記録なし</div>'}
  <div class="rd">対戦</div>${TT.map(t=>tieHTML(t,1)).join('')}</div>`;return}
 const st=teamStats();const pc=['実業団','大学','高校','中学','その他'];
 let L=Object.entries(D.teams).filter(([k,t])=>t.cat==S.pcat&&st[k]);
 if(S.pcat=='中学'&&S.reg!='全地方')L=L.filter(([k,t])=>t.region==S.reg);
 if(S.q)L=L.filter(([k,t])=>t.name.includes(S.q));
 L.sort((a,b)=>st[b[0]].w-st[a[0]].w||a[1].name.localeCompare(b[1].name,'ja'));
 const nameCount={};Object.values(D.teams).forEach(t=>{const k=t.cat+t.name;nameCount[k]=(nameCount[k]||0)+1});
 m.innerHTML=`${chips('pc',pc,S.pcat,'setPc')}${S.pcat=='中学'?chips('rg',REGS,S.reg,'setReg'):''}<input type="search" placeholder="チーム名で検索" value="${esc(S.q)}" oninput="S.q=this.value;renderTiesDeb()"><div class="card">${L.map(([k,t])=>`<div class="li" onclick="S.team='${esc(k)}';render()"><span>${esc(t.name)}${nameCount[t.cat+t.name]>1&&t.pref?` <span class="sub" style="font-size:10px">${esc(t.pref)}</span>`:''}</span><span class="c">${st[k].w}勝${st[k].l}敗</span></div>`).join('')||'<div class="sub" style="padding:8px">該当なし</div>'}</div>`}
function setPc(c){S.pcat=c;S.reg='全地方';render()}function setReg(r){S.reg=r;render()}
function renderRk(){const T=ties().filter(t=>(S.ty=='全年'||t.y==S.ty)&&t.g==S.rkg);
 const ts={};for(const t of T)for(const[k,me,op]of[[t.ak,t.sa,t.sb],[t.bk,t.sb,t.sa]]){const s=ts[k]=ts[k]||{w:0,l:0,v:0};me>op?s.w++:s.l++}
 for(const p of D.pl)if(p.rank==1&&p.g==S.rkg&&(S.ty=='全年'||p.yr==S.ty)&&(S.cat=='全て'||p.cat==S.cat)){const k=Object.keys(D.teams).find(k=>D.teams[k].name==p.name);if(k){ts[k]=ts[k]||{w:0,l:0,v:0};ts[k].v=(ts[k].v||0)+1}}
 const ps={};for(const r of rubbers(T)){if(/\//.test(r.w))continue;for(const[n,k,w]of[[r.w,r.wk,1],[r.l,r.lk,0]]){const id=n+'||'+k;const p=ps[id]=ps[id]||{w:0,l:0};w?p.w++:p.l++}}
 const TL=Object.entries(ts).sort((a,b)=>(b[1].v||0)-(a[1].v||0)||b[1].w-a[1].w).slice(0,50);const PL=Object.entries(ps).sort((a,b)=>b[1].w-a[1].w||a[1].l-b[1].l).slice(0,50);
 document.getElementById('main').innerHTML=`<div class="ych"><button class="${S.rkg=='M'?'on':''}" onclick="S.rkg='M';render()">男子</button><button class="${S.rkg=='W'?'on':''}" onclick="S.rkg='W';render()">女子</button></div>${chips('ty',yearsOf(ties()),String(S.ty),'setTy')}
 <div class="card sec"><h3>チーム（優勝回数・対戦勝敗）</h3><table><tr><th>#</th><th>チーム</th><th>優勝</th><th>勝-敗</th></tr>${TL.map(([k,s],i)=>`<tr><td>${i+1}</td><td>${esc((D.teams[k]||{name:k}).name)}</td><td>${s.v||''}</td><td>${s.w}-${s.l}</td></tr>`).join('')}</table></div>
 <div class="card sec"><h3>選手（団体戦シングルス勝利数）</h3><table><tr><th>#</th><th>選手</th><th>所属</th><th>勝-敗</th></tr>${PL.map(([id,s],i)=>{const[n,k]=id.split('||');return `<tr><td>${i+1}</td><td>${esc(n)}</td><td>${esc((D.teams[k]||{name:k}).name)}</td><td>${s.w}-${s.l}</td></tr>`}).join('')}</table></div>`}
function renderInfo(){const m=document.getElementById('main');
 m.innerHTML=`<div class="card sec"><h3>収録状況（団体戦）</h3><table><tr><th>大会</th><th>年</th><th>対戦</th><th>試合</th><th>GS</th><th>深さ</th></tr>${D.cov.filter(c=>S.cat=='全て'||EVCAT(c.e)==S.cat).map(c=>`<tr><td>${esc(D.evn[c.e].replace(/（.*）/,''))}${c.s?' '+c.s:''}</td><td>${c.y}</td><td>${c.ties}</td><td>${c.rub}</td><td>${c.gs}</td><td>${c.dep}</td></tr>`).join('')}</table>
 <div class="sub">GS=ゲームスコア付き試合数。2020年は全大会中止、全日本実業団は2021年も中止。年は開催年（選抜大会は3月開催年）。出典: 卓球レポート（butterfly.co.jp/takurepo）、日本卓球リーグ実業団連盟 公式記録、日本卓球協会 歴代優勝者。</div></div>
 <div class="card sec"><h3>試合を追加（端末に保存）</h3><form id="uf" onsubmit="saveUser(event)"><input type="hidden" name="uid">
 <label>大会</label><select name="e">${Object.keys(D.evn).map(e=>`<option value="${e}">${esc(D.evn[e])}</option>`).join('')}</select>
 <label>年</label><input name="y" type="number" value="2026"><label>前期/後期（日本リーグのみ）</label><input name="s">
 <label>性別</label><select name="g"><option value="M">男子</option><option value="W">女子</option></select><label>ラウンド</label><input name="r" placeholder="決勝">
 <label>チームA</label><input name="a" required><label>チームB</label><input name="b" required><label>スコア A-B</label><input name="sc" placeholder="3-2" required>
 <label>試合（1行1試合: 選手A,選手B,11-7 9-11 11-5）</label><textarea name="u" rows="5"></textarea>
 <button class="btn pri">保存</button></form>
 <div style="margin-top:8px"><button class="btn" onclick="exportUser()">ユーザー追加分をエクスポート</button><label class="btn">インポート<input type="file" accept=".json" style="display:none" onchange="importUser(this)"></label><button class="btn" onclick="exportCSV()">全データCSV</button></div>
 <div class="sub">ユーザー追加: ${USER.length}件</div></div>`}
function parseRub(line,i){const p=line.split(/[,，]/);if(p.length<2)return null;const g=(p[2]||'').trim().split(/\s+/).filter(Boolean).map(x=>x.split(/[-ー]/).map(Number));const sa=g.filter(x=>x[0]>x[1]).length,sb=g.filter(x=>x[1]>x[0]).length;return [i+1,p[0].trim(),p[1].trim(),sa,sb,g]}
function saveUser(ev){ev.preventDefault();const f=new FormData(ev.target);const sc=(f.get('sc')||'').split(/[-ー]/).map(Number);
 const uid=f.get('uid')?+f.get('uid'):Date.now();const a=f.get('a'),b=f.get('b'),cat=D.cat[f.get('e')];
 const t={uid,e:f.get('e'),y:+f.get('y'),s:f.get('s')||'',g:f.get('g'),r:f.get('r')||'',a,b,ak:cat+'|'+a+'|',bk:cat+'|'+b+'|',sa:sc[0]||0,sb:sc[1]||0,u:(f.get('u')||'').split('\n').filter(x=>x.trim()).map(parseRub).filter(Boolean),src:'user'};
 USER=USER.filter(x=>x.uid!=uid);USER.push(t);localStorage.setItem(LS,JSON.stringify(USER));
 for(const k of [t.ak,t.bk])if(!D.teams[k])D.teams[k]={cat:cat=='一般'?'その他':cat,name:k.split('|')[1],pref:'',region:''};alert('保存しました');render()}
function editUser(uid){const t=USER.find(x=>x.uid==uid);S.tab='info';render();const f=document.getElementById('uf');for(const k of['uid','e','y','s','g','r','a','b'])f[k].value=t[k];f.sc.value=t.sa+'-'+t.sb;f.u.value=t.u.map(u=>u[1]+','+u[2]+','+u[5].map(x=>x.join('-')).join(' ')).join('\n');syncTabs()}
function delUser(uid){if(!confirm('削除しますか？'))return;USER=USER.filter(x=>x.uid!=uid);localStorage.setItem(LS,JSON.stringify(USER));render()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportUser(){dl('tt_domestic_user.json',JSON.stringify(USER,null,1),'application/json')}
function importUser(inp){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);USER=USER.filter(u=>!x.some(v=>v.uid==u.uid)).concat(x);localStorage.setItem(LS,JSON.stringify(USER));render()}catch(e){alert('読込失敗')}};r.readAsText(inp.files[0])}
function exportCSV(){const rows=[['大会','年','期','性別','ラウンド','チームA','チームB','対戦スコア','番','選手A','選手B','試合スコア','ゲーム']];for(const t of allTies()){if(!t.u||!t.u.length)rows.push([D.evn[t.e],t.y,t.s,GEN[t.g],t.r,t.a,t.b,t.sa+'-'+t.sb,'','','','','']);for(const u of t.u||[])rows.push([D.evn[t.e],t.y,t.s,GEN[t.g],t.r,t.a,t.b,t.sa+'-'+t.sb,u[0],u[1],u[2],u[3]+'-'+u[4],(u[5]||[]).map(x=>x.join('-')).join(' ')])}
 dl('tt_domestic_team.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function syncTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab))}
function render(){document.getElementById('cat').innerHTML=CATS.map(c=>`<button class="${c==S.cat?'on':''}" onclick="S.cat='${c}';S.ev=null;render()">${c}</button>`).join('');
 document.getElementById('gen').innerHTML=Object.entries(GEN).map(([k,v])=>`<button class="${k==S.g?'on':''}" onclick="S.g='${k}';render()">${v}</button>`).join('');
 USER.forEach(u=>{for(const k of [u.ak,u.bk])if(!D.teams[k])D.teams[k]={cat:D.cat[u.e]=='一般'?'その他':D.cat[u.e],name:k.split('|')[1],pref:'',region:''}});
 syncTabs();({ev:renderEv,ties:renderTies,mt:renderMt,pl:renderPl,rk:renderRk,info:renderInfo})[S.tab]()}
document.getElementById('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.tab=t;S.q='';render();window.scrollTo(0,0)};
render();
</script></body></html>
