<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイ卓球ログ</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2533;--sub:#6b7484;--line:#e2e6ec;--acc:#c8102e;--acc2:#1f4e78;--win:#c8102e;--winbg:#fff1f2;--chip:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--acc2);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:6px}.tab{flex:1;background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 4px;border-radius:8px;font-size:14px}.tab.on{background:#fff;color:var(--acc2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:10px}
.panel{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.panel h2{font-size:15px;margin:0 0 8px;border-left:4px solid var(--acc2);padding-left:6px}
label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:2px;margin-bottom:6px}
select,input,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink)}.btn.pri{background:var(--acc2);color:#fff;border-color:var(--acc2)}.btn.del{color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;border:1px solid transparent}
button.chip{font-size:13px;padding:5px 11px}button.chip.on{background:var(--acc2);color:#fff}
.it{border-left:5px solid var(--acc2);padding:8px 10px;border-radius:8px;background:#fafbfc;margin-bottom:8px}.it.w{border-left-color:var(--win);background:var(--winbg)}.it.l{border-left-color:#8a94a6}
.it .nm{font-weight:700}.it .inf{font-size:12px;color:var(--sub)}
.wl{font-weight:700;color:var(--win)}.wl.l{color:#5b6475}
.gs{display:flex;gap:4px;align-items:center;margin-bottom:4px}.gs input{width:60px;text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kp div{background:var(--chip);border-radius:10px;padding:8px 4px}.kp b{display:block;font-size:20px;color:var(--acc2)}.kp span{font-size:11px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--sub);font-weight:600;font-size:12px}tr.tap{cursor:pointer}
.welcome{text-align:center;padding:24px 10px}.welcome b{font-size:20px;color:var(--acc2)}
.sub{font-size:12px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-end}.modal.on{display:flex}.modal .panel{width:100%;max-height:85vh;overflow:auto;margin:0;border-radius:14px 14px 0 0}
</style></head><body>
<header><h1>🏓 マイ卓球ログ</h1><div class="tabs">
<button class="tab on" data-t="match">試合</button><button class="tab" data-t="prac">練習</button><button class="tab" data-t="stat">成績</button><button class="tab" data-t="gear">用具</button><button class="tab" data-t="data">データ</button></div></header>
<main id="main"></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="panel" id="mbody"></div></div>
<datalist id="opps"></datalist><datalist id="partners"></datalist>
<script>
const KEY='mytt_v1',START='2026/10/13';
let D=JSON.parse(localStorage.getItem(KEY)||'null')||{matches:[],practices:[],gear:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TYPES=['練習試合','大会','リーグ'],STYLES=['','シェーク攻撃','ペン（表/裏）','カット','異質（粒高/表）','その他'],MENU=['フォアハンド','バックハンド','サーブ','レシーブ','フットワーク','ツッツキ','ドライブ','ゲーム練習','多球練習'];
let tab='match';
function res(m){let w=0,l=0,du=[0,0];(m.games||[]).forEach(g=>{if(g[0]>g[1])w++;else if(g[1]>g[0])l++;if(g[0]>=10&&g[1]>=10)g[0]>g[1]?du[0]++:du[1]++});return{w,l,win:w>l,du}}
const sorted=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date));
function welcome(){return `<div class="panel welcome"><b>今日から卓球スタート</b><div style="font-size:18px;margin:4px 0">${START}</div><div class="sub">上の「＋」ボタンから最初の試合・練習を記録しよう</div></div>`}
function mItem(m){const r=res(m);return `<div class="it ${r.win?'w':'l'}" onclick="editMatch('${m.id}')"><div class="row" style="justify-content:space-between"><span class="nm">vs ${esc(m.opp)}${m.event==='ダブルス'?` <span class="sub">(ペア:${esc(m.partner)})</span>`:''}</span><span class="wl ${r.win?'':'l'}">${r.win?'勝':'負'} ${r.w}-${r.l}</span></div><div class="inf">${m.date} ・ ${m.type} ・ ${m.event}${m.style?' ・ '+esc(m.style):''}${m.tour?' ・ '+esc(m.tour):''}${m.round?' '+esc(m.round):''}</div><div class="inf">${(m.games||[]).map(g=>g.join('-')).join(', ')}</div>${m.memo?`<div class="inf">📝 ${esc(m.memo)}</div>`:''}</div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
$('#opps').innerHTML=[...new Set(D.matches.map(m=>m.opp))].map(o=>`<option value="${esc(o)}">`).join('');
$('#partners').innerHTML=[...new Set(D.matches.map(m=>m.partner).filter(Boolean))].map(o=>`<option value="${esc(o)}">`).join('');
const M=$('#main');
if(tab==='match')M.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="editMatch()">＋ 試合を記録</button></div>`+(D.matches.length?`<div class="panel"><h2>試合記録（${D.matches.length}）</h2>${sorted(D.matches).map(mItem).join('')}</div>`:welcome());
if(tab==='prac')M.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="editPrac()">＋ 練習を記録</button></div>`+(D.practices.length?`<div class="panel"><h2>練習記録（${D.practices.length}）</h2>${sorted(D.practices).map(p=>`<div class="it" onclick="editPrac('${p.id}')"><div class="row" style="justify-content:space-between"><span class="nm">${p.date}　${p.dur}分</span><span>${'★'.repeat(p.cond||0)}${'☆'.repeat(5-(p.cond||0))}</span></div><div class="inf">${esc(p.place)}</div><div class="row" style="margin-top:3px">${(p.menu||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div>${p.memo?`<div class="inf">📝 ${esc(p.memo)}</div>`:''}</div>`).join('')}</div>`:welcome());
if(tab==='stat')M.innerHTML=stats();
if(tab==='gear')M.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="editGear()">＋ 用具を追加</button></div><div class="panel"><h2>用具メモ</h2>${D.gear.length?sorted(D.gear).map(g=>`<div class="it" onclick="editGear('${g.id}')"><div class="nm">${esc(g.kind)}：${esc(g.name)}</div><div class="inf">使用開始/交換日 ${g.date}${g.memo?' ・ '+esc(g.memo):''}</div></div>`).join(''):'<div class="sub">ラケット・ラバーを登録して交換日を管理しよう</div>'}</div>`;
if(tab==='data')M.innerHTML=`<div class="panel"><h2>バックアップ</h2><div class="sub" style="margin-bottom:8px">データはこの端末のブラウザ内（localStorage）に保存されます。定期的にバックアップしてください。</div><div class="row"><button class="btn pri" onclick="expJSON()">JSONエクスポート</button><button class="btn" onclick="$('#imp').click()">JSONインポート</button><input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(this)"></div></div><div class="panel"><h2>CSVエクスポート</h2><div class="row"><button class="btn" onclick="expCSV('m')">試合CSV</button><button class="btn" onclick="expCSV('p')">練習CSV</button></div></div><div class="panel"><h2>データ削除</h2><button class="btn del" onclick="if(confirm('全データを削除しますか？')){D={matches:[],practices:[],gear:[]};save();render()}">全データを削除</button></div>`}
function agg(list){let w=0,l=0,gw=0,gl=0;list.forEach(m=>{const r=res(m);r.win?w++:l++;gw+=r.w;gl+=r.l});return{w,l,gw,gl,n:w+l}}
const pct=(a,b)=>a+b?Math.round(a*100/(a+b))+'%':'-';
function bars(data,unit,col){if(!data.length)return'<div class="sub">データなし</div>';const mx=Math.max(...data.map(d=>d[1]),1),W=380,bw=Math.min(40,(W-20)/data.length-6),H=130;return `<svg viewBox="0 0 ${W} ${H+30}" width="100%">${data.map((d,i)=>{const h=d[1]/mx*H,x=10+i*(bw+6);return `<rect x="${x}" y="${H-h+10}" width="${bw}" height="${h}" rx="3" fill="${col}"/><text x="${x+bw/2}" y="${H-h+6}" font-size="10" text-anchor="middle" fill="#1d2533">${d[1]}${unit}</text><text x="${x+bw/2}" y="${H+24}" font-size="10" text-anchor="middle" fill="#6b7484">${d[0]}</text>`}).join('')}</svg>`}
function stats(){if(!D.matches.length&&!D.practices.length)return welcome();
const ms=[...D.matches].sort((a,b)=>a.date.localeCompare(b.date)),A=agg(ms);let du=[0,0];ms.forEach(m=>{const r=res(m);du[0]+=r.du[0];du[1]+=r.du[1]});
let cur=0,cw=0,bw=0,bl=0,run=0;ms.forEach(m=>{const w=res(m).win;if(w){run=run>0?run+1:1}else{run=run<0?run-1:-1}bw=Math.max(bw,run);bl=Math.min(bl,run)});cur=run;
const grp=(f)=>{const o={};ms.forEach(m=>{const k=f(m);(o[k]=o[k]||[]).push(m)});return o};
const byM=grp(m=>m.date.slice(0,7)),byO=grp(m=>m.opp),byS=grp(m=>m.style||'未設定'),byT=grp(m=>m.type);
const tbl=(o,tap)=>`<table><tr><th></th><th>勝-敗</th><th>勝率</th><th>ゲーム</th></tr>${Object.entries(o).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>{const a=agg(v);return `<tr ${tap?`class="tap" onclick="oppHist('${esc(k).replace(/'/g,"\\'")}')"`:''}><td>${tap?'<u>'+esc(k)+'</u>':esc(k)}</td><td>${a.w}-${a.l}</td><td>${pct(a.w,a.l)}</td><td>${a.gw}-${a.gl}</td></tr>`}).join('')}</table>`;
const pm={};D.practices.forEach(p=>{const k=p.date.slice(0,7);pm[k]=(pm[k]||0)+(+p.dur||0)});
const mon=Object.keys(byM).sort().slice(-8).map(k=>[k.slice(5)+'月',Math.round(agg(byM[k]).w*100/byM[k].length)]);
return `<div class="panel"><h2>通算成績</h2><div class="kp"><div><b>${A.w}-${A.l}</b><span>勝-敗</span></div><div><b>${pct(A.w,A.l)}</b><span>勝率</span></div><div><b>${pct(A.gw,A.gl)}</b><span>ゲーム取得率 ${A.gw}-${A.gl}</span></div><div><b>${du[0]}-${du[1]}</b><span>デュース</span></div><div><b>${cur>0?cur+'連勝':cur<0?(-cur)+'連敗':'-'}</b><span>現在</span></div><div><b>${bw}</b><span>最長連勝</span></div></div></div>
<div class="panel"><h2>月別勝率</h2>${bars(mon,'%','#1f4e78')}${tbl(Object.fromEntries(Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0]))))}</div>
<div class="panel"><h2>対戦相手別（タップで履歴）</h2>${tbl(byO,1)}</div>
<div class="panel"><h2>戦型別</h2>${tbl(byS)}</div><div class="panel"><h2>種別</h2>${tbl(byT)}</div>
<div class="panel"><h2>月別練習時間</h2>${bars(Object.keys(pm).sort().slice(-8).map(k=>[k.slice(5)+'月',+(pm[k]/60).toFixed(1)]),'h','#2a8f5b')}</div>`}
function oppHist(o){openM(`<h2>vs ${esc(o)}</h2>${(a=>`<div class="sub" style="margin-bottom:8px">${a.w}勝${a.l}敗（${pct(a.w,a.l)}）</div>`)(agg(D.matches.filter(m=>m.opp===o)))}${sorted(D.matches.filter(m=>m.opp===o)).map(mItem).join('')}<button class="btn" onclick="closeM()">閉じる</button>`)}
function openM(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''} value="${x}">${x||'（未設定）'}</option>`).join('');
function editMatch(id){const m=D.matches.find(x=>x.id===id)||{date:today(),type:'練習試合',event:'シングルス',games:[[0,0],[0,0],[0,0]]};
openM(`<h2>${id?'試合を編集':'試合を記録'}</h2><div class="g2"><label>日付<input type="date" id="f_date" value="${m.date}"></label><label>種別<select id="f_type">${opt(TYPES,m.type)}</select></label><label>種目<select id="f_event" onchange="$('#pw').style.display=this.value==='ダブルス'?'':'none'">${opt(['シングルス','ダブルス'],m.event)}</select></label><label id="pw" style="${m.event==='ダブルス'?'':'display:none'}">パートナー<input id="f_partner" list="partners" value="${esc(m.partner)}"></label></div>
<label>対戦相手<input id="f_opp" list="opps" value="${esc(m.opp)}" placeholder="名前"></label><label>相手の戦型<select id="f_style">${opt(STYLES,m.style||'')}</select></label>
<div class="g2"><label>大会名<input id="f_tour" value="${esc(m.tour)}"></label><label>回戦<input id="f_round" value="${esc(m.round)}" placeholder="例: 2回戦"></label></div>
<label>ゲームスコア（自分-相手）</label><div id="gl">${m.games.map(g=>gRow(g)).join('')}</div><button class="btn" onclick="$('#gl').insertAdjacentHTML('beforeend',gRow([0,0]))">＋ゲーム</button>
<label style="margin-top:8px">メモ<textarea id="f_memo" rows="3">${esc(m.memo)}</textarea></label>
<div class="row"><button class="btn pri" onclick="saveMatch('${id||''}')">保存</button><button class="btn" onclick="closeM()">キャンセル</button>${id?`<button class="btn del" onclick="delIt('matches','${id}')">削除</button>`:''}</div>`)}
const gRow=g=>`<div class="gs"><input type="number" inputmode="numeric" value="${g[0]||''}"> - <input type="number" inputmode="numeric" value="${g[1]||''}"><button class="btn" onclick="this.parentNode.remove()">×</button></div>`;
const v=i=>$('#'+i).value.trim();
function upsert(k,o,id){if(id){const i=D[k].findIndex(x=>x.id===id);o.id=id;D[k][i]=o}else{o.id=uid();D[k].push(o)}save();closeM();render()}
function saveMatch(id){const games=[...document.querySelectorAll('#gl .gs')].map(r=>[...r.querySelectorAll('input')].map(i=>+i.value||0)).filter(g=>g[0]||g[1]);if(!v('f_opp')||!games.length)return alert('相手とスコアを入力してください');
upsert('matches',{date:v('f_date'),type:v('f_type'),event:v('f_event'),partner:v('f_event')==='ダブルス'?v('f_partner'):'',opp:v('f_opp'),style:v('f_style'),tour:v('f_tour'),round:v('f_round'),games,memo:v('f_memo')},id)}
function editPrac(id){const p=D.practices.find(x=>x.id===id)||{date:today(),dur:90,cond:3,menu:[]};
openM(`<h2>${id?'練習を編集':'練習を記録'}</h2><div class="g2"><label>日付<input type="date" id="f_date" value="${p.date}"></label><label>時間（分）<input type="number" id="f_dur" value="${p.dur}"></label></div><label>場所<input id="f_place" value="${esc(p.place)}"></label>
<label>メニュー</label><div class="row" id="menu" style="margin-bottom:8px">${MENU.map(x=>`<button class="chip ${p.menu.includes(x)?'on':''}" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div>
<label>コンディション</label><div class="row" id="cond" data-v="${p.cond}" style="margin-bottom:8px">${[1,2,3,4,5].map(n=>`<button class="chip ${n==p.cond?'on':''}" onclick="this.parentNode.dataset.v=${n};[...this.parentNode.children].forEach(c=>c.classList.toggle('on',c===this))">${n}</button>`).join('')}</div>
<label>メモ<textarea id="f_memo" rows="3">${esc(p.memo)}</textarea></label><div class="row"><button class="btn pri" onclick="savePrac('${id||''}')">保存</button><button class="btn" onclick="closeM()">キャンセル</button>${id?`<button class="btn del" onclick="delIt('practices','${id}')">削除</button>`:''}</div>`)}
function savePrac(id){upsert('practices',{date:v('f_date'),dur:+v('f_dur')||0,place:v('f_place'),menu:[...document.querySelectorAll('#menu .on')].map(b=>b.textContent),cond:+$('#cond').dataset.v,memo:v('f_memo')},id)}
function editGear(id){const g=D.gear.find(x=>x.id===id)||{date:today(),kind:'ラケット'};openM(`<h2>用具</h2><label>種類<select id="f_kind">${opt(['ラケット','ラバー（フォア）','ラバー（バック）','シューズ','その他'],g.kind)}</select></label><label>名前<input id="f_name" value="${esc(g.name)}"></label><label>使用開始/交換日<input type="date" id="f_date" value="${g.date}"></label><label>メモ<textarea id="f_memo">${esc(g.memo)}</textarea></label><div class="row"><button class="btn pri" onclick="upsert('gear',{kind:v('f_kind'),name:v('f_name'),date:v('f_date'),memo:v('f_memo')},'${id||''}')">保存</button><button class="btn" onclick="closeM()">キャンセル</button>${id?`<button class="btn del" onclick="delIt('gear','${id}')">削除</button>`:''}</div>`)}
function delIt(k,id){if(!confirm('削除しますか？'))return;D[k]=D[k].filter(x=>x.id!==id);save();closeM();render()}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function expJSON(){dl('mytt_backup_'+today()+'.json',JSON.stringify(D,null,1),'application/json')}
function impJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.matches)throw 0;if(confirm('現在のデータを置き換えますか？')){D={matches:o.matches||[],practices:o.practices||[],gear:o.gear||[]};save();render();alert('インポートしました')}}catch(e){alert('ファイルが不正です')}})}
function expCSV(k){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let rows;
if(k==='m')rows=[['日付','種別','種目','パートナー','相手','戦型','大会','回戦','スコア','ゲーム','勝敗','メモ'],...sorted(D.matches).map(m=>{const r=res(m);return[m.date,m.type,m.event,m.partner,m.opp,m.style,m.tour,m.round,m.games.map(g=>g.join('-')).join(' '),r.w+'-'+r.l,r.win?'勝':'負',m.memo]})];
else rows=[['日付','時間(分)','場所','メニュー','コンディション','メモ'],...sorted(D.practices).map(p=>[p.date,p.dur,p.place,p.menu.join('/'),p.cond,p.memo])];
dl(`mytt_${k==='m'?'matches':'practices'}_${today()}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
if(location.hash.slice(1))tab=location.hash.slice(1);render();
</script></body></html>
