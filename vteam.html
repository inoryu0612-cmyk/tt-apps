<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【仮想】WTT団体戦</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2533;--sub:#6b7484;--line:#e2e6ec;--acc:#c8102e;--acc2:#1f4e78;--win:#c8102e;--winbg:#fff1f2;--chip:#eef2f7;--v:#7a3fb0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--acc2);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1 a{color:#cfe0f5;font-size:12px;font-weight:400;margin-left:auto;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:2px 8px}
.vbadge{background:var(--v);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700}
.hsub{font-size:11.5px;color:#cfe0f5;margin:0 0 8px}
.tabs{display:flex;gap:5px}
.tab{flex:1;white-space:nowrap;background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 2px;border-radius:8px;font-size:13.5px;cursor:pointer}
.tab.on{background:#fff;color:var(--acc2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:10px}
.panel{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:2px}
.filters .wide{grid-column:span 2}
select,input[type=search],input[type=number]{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
.summary{font-size:13px;color:var(--sub);margin:4px 2px 8px}
.tour{background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;cursor:pointer}
.th{padding:8px 12px;border-left:5px solid var(--acc2)}
.k-feeder{border-left-color:#8a96a8}.k-contender{border-left-color:#2a8f5b}.k-star{border-left-color:#e08a00}.k-smash{border-left-color:#c8102e}.k-champions{border-left-color:#6a4fb3}.k-finals,.k-cupfinals{border-left-color:#000}.k-worldcup{border-left-color:#0b7fa8}.k-worlds,.k-worldsteam{border-left-color:#b8860b}.k-mixedteam{border-left-color:#d1477a}
.th .nm{font-weight:700;font-size:15px}
.th .inf{font-size:12px;color:var(--sub);margin-top:1px}
.best{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:var(--chip);border-radius:999px;padding:2px 8px;font-size:11.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.chip.gold{background:#fff4cc}.chip.silver{background:#e9ecf1}.chip.bronze{background:#f8e6d8}.chip.jp{background:#fde8ea;color:#9b0d22}.chip.live{background:#e3f4ea;color:#17703f}.chip.up{background:#eef0f3;color:#6b7484}.chip.v{background:#f1e8fa;color:var(--v)}
.ych{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.ych::-webkit-scrollbar{display:none}
.ych button{flex:1 0 auto;min-width:46px;border:1px solid #c9d1dc;background:#fff;border-radius:999px;padding:5px 8px;font-size:13px;font-weight:600;color:#33475b}.ych button.on{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
table{border-collapse:collapse;width:100%}
.tbl{font-size:13px}.tbl th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:5px 4px;border-bottom:1px solid #f0f2f5;text-align:right;white-space:nowrap}
.tbl td.l,.tbl th.l{text-align:left;white-space:normal}.tbl tr.q td{background:#f2f8ff}.tbl tr.me td{background:#fff5f6}
.tbl tr.click{cursor:pointer}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.big div{background:var(--chip);border-radius:10px;padding:6px 2px}.big b{display:block;font-size:20px}.big span{font-size:11px;color:var(--sub)}
h2{font-size:15px;margin:4px 2px 8px}h3{font-size:14px;margin:12px 2px 6px;color:var(--acc2)}
.muted{color:var(--sub);font-size:12px}
#ev{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
#ev.on{display:block}
#evh{position:sticky;top:0;background:var(--acc2);color:#fff;padding:8px 10px;z-index:5}
#evh .bk{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-size:14px;margin-right:6px}
#evh .t{font-weight:700;font-size:15px}
#evtabs{display:flex;gap:5px;margin-top:6px}#evtabs button{flex:1;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 2px;font-size:13px}#evtabs button.on{background:#fff;color:var(--acc2);font-weight:700}
.tie{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff;overflow:hidden}
.tie .hd{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:7px 8px;cursor:pointer}
.tie .hd .h{text-align:right}.tie .sc{font-weight:700;font-size:16px;min-width:44px;text-align:center}
.tie .w{font-weight:700;color:var(--win)}
.tie .lab{font-size:11px;color:var(--sub);padding:5px 8px 0}
.tie .rbs{display:none;border-top:1px dashed var(--line);padding:4px 8px 8px;font-size:13px}.tie.open .rbs{display:block}
.rb{display:grid;grid-template-columns:34px 1fr 34px 1fr;gap:4px;padding:3px 0;border-bottom:1px solid #f4f5f8;align-items:center}
.rb .o{font-size:11px;color:var(--sub)}.rb .g{grid-column:2/5;font-size:11.5px;color:var(--sub);margin-top:-2px}.rb .gw{text-align:center;font-weight:700}
.rb .r{text-align:left}
.tie.jp{border-color:#f3b2bb}
.u{color:var(--sub);font-size:13px}
.lu{font-size:11.5px;color:var(--sub);padding:2px 0 4px}
.roster{font-size:13px;padding:6px 0;border-bottom:1px solid #f0f2f5}.roster b{font-size:14px}.roster .pl{color:var(--ink);font-size:12.5px;margin-top:2px}
.foot{font-size:11px;color:var(--sub);text-align:center;padding:10px 0 30px}
.flag{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pdet td{background:#fafbfc;font-size:12px;color:var(--sub);text-align:left!important;white-space:normal!important}
@media(min-width:700px){.filters{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
 <h1><span class="vbadge">仮想</span>WTT団体戦（男子3人制）<a href="wtt.html">← 戦績アプリ</a></h1>
 <div class="hsub" id="hsub">読み込み中…</div>
 <div class="tabs">
  <button class="tab on" data-t="ev">大会</button>
  <button class="tab" data-t="jp">日本</button>
  <button class="tab" data-t="wr">勝率</button>
  <button class="tab" data-t="ct">国別</button>
  <button class="tab" data-t="live">進行中</button>
 </div>
</header>
<main id="main"></main>
<div id="ev"><div id="evh"></div><main id="evb"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={feeder:'フィーダー',contender:'コンテンダー',star:'スターコンテンダー',smash:'グランドスマッシュ',champions:'チャンピオンズ',finals:'ファイナルズ',cupfinals:'カップファイナルズ',worldcup:'ワールドカップ',worlds:'世界卓球（個人戦）',worldsteam:'世界卓球（団体戦）',mixedteam:'混合団体W杯'};
const TIER=[['','すべて'],['feeder','フィーダー'],['contender','コンテンダー'],['star','スターコンテンダー'],['smash','グランドスマッシュ'],['champions','チャンピオンズ'],['finals','ファイナルズ'],['worldcup','ワールドカップ'],['worlds','世界卓球'],['mixedteam','混合団体W杯']];
const tierOf=k=>k==='cupfinals'?'finals':k==='worldsteam'?'worlds':k;
let D=null,ST={tab:'ev',y:'',tier:'',q:'',jy:'',jt:'',wy:'',wt:'',wn:'JPN',wmin:10,wsort:'pct',cy:'',ctier:'',wopen:null};
const evCache={};
function md(d){return d?(+d.slice(5,7))+'/'+(+d.slice(8)):''}
function tn(t){return t?`<span class=flag>${t[2]}</span>${esc(t[1])}`:''}
function finCls(f){return f==='優勝'?'gold':f==='準優勝'?'silver':/ベスト4|3位|4位/.test(f)?'bronze':(f==='進行中'?'live':(f==='未実施'?'up':''))}
function stChip(s){return s.status==='live'?'<span class="chip live">進行中</span>':s.status==='upcoming'?'<span class="chip up">開催前</span>':''}
async function init(){
 try{const r=await fetch('vteam/index.json?v='+Date.now());D=await r.json();}catch(e){$('main').innerHTML='<div class=panel>データを読み込めませんでした</div>';return}
 D.events.forEach((e,i)=>e.i=i);
 const nd=D.events.filter(e=>e.status==='done').length;
 $('hsub').textContent=`2021〜2026 全${D.events.length}大会（終了${nd}）・シミュレーション結果／進行中は${md(D.revealed)}公開分まで・更新 ${D.built}`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();window.scrollTo(0,0)});
 window.addEventListener('popstate',()=>{if(!location.hash.startsWith('#e='))closeEv(true);else openEv(decodeURIComponent(location.hash.slice(3)),true)});
 render();
 if(location.hash.startsWith('#e='))openEv(decodeURIComponent(location.hash.slice(3)),true);
}
function years(){return [...new Set(D.events.map(e=>e.year))].sort()}
function ych(cur,key){return `<div class=ych>`+[['','全期間'],...years().map(y=>[String(y),y])].map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')+`</div>`}
function tierSel(cur,key){return `<label>大会グレード<select data-k="${key}">`+TIER.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')+`</select></label>`}
function bind(){
 document.querySelectorAll('#main [data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(el.tagName==='BUTTON')el.onclick=()=>{ST[k]=el.dataset.v;render()};
  else if(el.tagName==='SELECT')el.onchange=()=>{ST[k]=el.value;render()};
  else el.oninput=()=>{ST[k]=el.type==='number'?(+el.value||0):el.value;clearTimeout(bind.t);bind.t=setTimeout(()=>{render();const x=document.querySelector(`#main [data-k="${k}"]`);if(x){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(_){}}},250)};
 });
 document.querySelectorAll('#main [data-ev]').forEach(el=>el.onclick=()=>openEv(el.dataset.ev));
}
function evMatch(e,y,t){return (!y||String(e.year)===y)&&(!t||tierOf(e.kind)===t)}
function evCard(e){
 const jp=e.jp.map(j=>`<span class="chip jp">🇯🇵${esc(j[1])}：${esc(j[2])}</span>`).join('');
 let res='';
 if(e.ch)res+=`<span class="chip gold">🏆 ${tn(e.ch)}</span><span class="chip silver">準 ${tn(e.ru)}</span>`+e.b4.map(b=>`<span class="chip bronze">4強 ${tn(b)}</span>`).join('');
 else res+=stChip(e);
 return `<div class=tour data-ev="${e.k}"><div class="th k-${e.kind}"><div class=nm>${esc(e.host)} ${esc(e.title)}</div><div class=inf>${e.year}　${esc(e.dates)}　${KIND[e.kind]||''}　${e.n}チーム</div><div class=best>${res}${jp}</div></div></div>`;
}
function rEv(){
 let L=D.events.filter(e=>evMatch(e,ST.y,ST.tier));
 if(ST.q){const q=ST.q.trim();L=L.filter(e=>(e.title+e.host+(e.ch?e.ch[1]:'')).includes(q))}
 L=L.slice().reverse();
 return `<div class=panel>${ych(ST.y,'y')}<div class=filters>${tierSel(ST.tier,'tier')}<label>大会名・優勝国で検索<input type=search data-k=q value="${esc(ST.q)}" placeholder="例：ドーハ、日本"></label></div></div>
 <div class=summary>${L.length}大会（新しい順）・タップで組み合わせと全試合</div>`+L.map(evCard).join('');
}
const FINORD=['優勝','準優勝','3位','4位','ベスト4','ベスト8'];
function rJp(){
 const L=D.events.filter(e=>evMatch(e,ST.jy,ST.jt));
 const withJ=L.filter(e=>e.jp.length);
 const best=e=>{let b=99;e.jp.forEach(j=>{const i=FINORD.indexOf(j[2]);if(i>=0&&i<b)b=i});return b};
 const cnt=i=>withJ.filter(e=>best(e)===i).length;
 const t1=cnt(0),t2=cnt(1),t4=cnt(2)+cnt(3)+cnt(4),t8=cnt(5);
 const idx=new Set(L.map(e=>e.i));
 const jt=D.jties.filter(t=>idx.has(t[0]));
 const byC={};jt.forEach(t=>{const k=t[5];(byC[k]=byC[k]||{w:0,l:0,n:D.countries[k]});if(t[7]>t[8])byC[k].w++;else byC[k].l++});
 const cl=Object.entries(byC).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l));
 const tw=jt.filter(t=>t[7]>t[8]).length;
 const titles=withJ.filter(e=>best(e)===0).reverse();
 return `<div class=panel>${ych(ST.jy,'jy')}<div class=filters>${tierSel(ST.jt,'jt')}</div></div>
 <div class=panel><h2>🇯🇵 日本の成績 <span class="chip v">仮想</span></h2><div class=big><div><b>${t1}</b><span>優勝</span></div><div><b>${t2}</b><span>準優勝</span></div><div><b>${t4}</b><span>ベスト4</span></div><div><b>${t8}</b><span>ベスト8</span></div></div>
 <div class="muted" style="margin-top:6px">出場 ${withJ.length}大会／対象 ${L.length}大会（日本チームは協会の男子シングルス出場者が3人以上の大会のみ）・タイ ${tw}勝${jt.length-tw}敗</div></div>
 <div class=panel><h3>🏆 優勝（${titles.length}）</h3>${titles.length?titles.map(e=>{const j=e.jp.find(x=>x[2]==='優勝');return `<div class="roster click" data-ev="${e.k}" style="cursor:pointer"><b>${e.year} ${esc(e.title)}</b> <span class=muted>${esc(j?j[1]:'')}・決勝 ${e.fs?e.fs.join('-'):''} ${e.ru?tn(e.ru):''}</span></div>`}).join(''):'<div class=muted>なし</div>'}</div>
 <div class=panel><h3>相手国別 タイ勝敗</h3><table class=tbl><tr><th class=l>相手</th><th>勝</th><th>敗</th><th>勝率</th></tr>${cl.map(([k,v])=>`<tr><td class=l><span class=flag>${v.n?v.n[1]:''}</span>${esc(v.n?v.n[0]:k)}</td><td>${v.w}</td><td>${v.l}</td><td>${(100*v.w/(v.w+v.l)).toFixed(0)}%</td></tr>`).join('')}</table></div>
 <div class=panel><h3>大会ごとの成績</h3>${withJ.slice().reverse().map(e=>`<div class=roster data-ev="${e.k}" style="cursor:pointer"><b>${e.year} ${esc(e.title)}</b> <span class=muted>${esc(e.dates)}</span><div class=best>${e.jp.map(j=>`<span class="chip ${finCls(j[2])}">${esc(j[1])}：${esc(j[2])}</span>`).join('')}${e.ch&&e.ch[3]!=='JPN'?`<span class=chip>🏆${tn(e.ch)}</span>`:''}</div></div>`).join('')}</div>`;
}
function aggregate(y,t,nat){
 const P={};
 for(const r of D.agg){
  if(y&&String(r[1])!==y)continue;if(t&&tierOf(r[2])!==t)continue;
  const p=D.players[r[0]];if(nat&&p[1]!==nat)continue;
  const a=P[r[0]]||(P[r[0]]={p:r[0],v:[0,0,0,0,0,0,0,0]});for(let i=0;i<8;i++)a.v[i]+=r[3+i];
 }
 return Object.values(P);
}
function rWr(){
 const nats=Object.entries(D.countries).sort((a,b)=>a[1][0].localeCompare(b[1][0],'ja'));
 let L=aggregate(ST.wy,ST.wt,ST.wn).filter(a=>a.v[0]+a.v[1]>0);
 const pct=a=>a.v[0]/(a.v[0]+a.v[1]);
 const main=L.filter(a=>a.v[0]+a.v[1]>=ST.wmin),sub=L.filter(a=>a.v[0]+a.v[1]<ST.wmin);
 const so={pct:(a,b)=>pct(b)-pct(a)||(b.v[0]-a.v[0]),w:(a,b)=>b.v[0]-a.v[0]||pct(b)-pct(a),m:(a,b)=>(b.v[0]+b.v[1])-(a.v[0]+a.v[1]),t:(a,b)=>b.v[6]-a.v[6]||pct(b)-pct(a)}[ST.wsort];
 main.sort(so);sub.sort(so);
 const row=(a,i)=>{const p=D.players[a.p],c=D.countries[p[1]]||['',''];const m=a.v[0]+a.v[1];
  let h=`<tr class=click data-p="${a.p}"><td>${i}</td><td class=l>${ST.wn?'':`<span class=flag>${c[1]}</span>`}${esc(p[0])}</td><td>${m}</td><td>${a.v[0]}-${a.v[1]}</td><td><b>${(100*pct(a)).toFixed(1)}</b></td><td>${a.v[4]+a.v[5]?a.v[4]+'-'+a.v[5]:'–'}</td><td>${a.v[6]||''}</td></tr>`;
  if(ST.wopen===a.p){const ys={};for(const r of D.agg){if(r[0]!==a.p)continue;if(ST.wt&&tierOf(r[2])!==ST.wt)continue;if(ST.wy&&String(r[1])!==ST.wy)continue;const z=ys[r[1]]||(ys[r[1]]=[0,0,0,0]);z[0]+=r[3];z[1]+=r[4];z[2]+=r[9];z[3]+=r[10]}
   h+=`<tr class=pdet><td></td><td colspan=6>${Object.entries(ys).map(([y,z])=>`${y}年：${z[0]}-${z[1]}（${(100*z[0]/Math.max(1,z[0]+z[1])).toFixed(0)}%）・${z[3]}大会${z[2]?'・優勝'+z[2]:''}`).join('<br>')}<br>ゲーム ${a.v[2]}-${a.v[3]}</td></tr>`}
  return h};
 const hd=`<tr><th>#</th><th class=l>選手</th><th>試合</th><th>勝-敗</th><th>勝率%</th><th>対中国</th><th>優勝</th></tr>`;
 return `<div class=panel>${ych(ST.wy,'wy')}<div class=filters>${tierSel(ST.wt,'wt')}<label>協会<select data-k=wn><option value="">全選手</option>${nats.map(([k,v])=>`<option value="${k}"${ST.wn===k?' selected':''}>${v[1]} ${esc(v[0])}</option>`).join('')}</select></label>
 <label>最低試合数<input type=number min=0 data-k=wmin value="${ST.wmin}"></label><label>並び順<select data-k=wsort>${[['pct','勝率'],['w','勝利数'],['m','試合数'],['t','優勝回数']].map(([v,l])=>`<option value="${v}"${ST.wsort===v?' selected':''}>${l}</option>`).join('')}</select></label></div></div>
 <div class=summary>【仮想】団体戦のシングルス（実施された試合のみ）。優勝＝優勝チームの登録メンバー。行をタップで年別。※は推定表記。</div>
 <div class=panel><h3>${ST.wmin}試合以上 ${main.length}人</h3><table class=tbl>${hd}${main.slice(0,300).map((a,i)=>row(a,i+1)).join('')}</table>${main.length>300?'<div class=muted>上位300人まで表示</div>':''}</div>
 ${sub.length&&ST.wn?`<div class=panel><h3>${ST.wmin}試合未満（参考）${sub.length}人</h3><table class=tbl>${hd}${sub.slice(0,200).map((a,i)=>row(a,'–')).join('')}</table></div>`:''}`;
}
function rCt(){
 const L=D.events.filter(e=>evMatch(e,ST.cy,ST.ctier)&&e.status==='done');
 const C={};const g=k=>C[k]||(C[k]={t:0,r:0,b:0,list:[]});
 L.forEach(e=>{g(e.ch[3]).t++;g(e.ch[3]).list.push(e);g(e.ru[3]).r++;e.b4.forEach(b=>g(b[3]).b++)});
 const rows=Object.entries(C).sort((a,b)=>b[1].t-a[1].t||b[1].r-a[1].r||b[1].b-a[1].b);
 return `<div class=panel>${ych(ST.cy,'cy')}<div class=filters>${tierSel(ST.ctier,'ctier')}</div></div>
 <div class=summary>終了した${L.length}大会。協会ごと（A・Bチームは合算）。国名をタップで優勝大会。</div>
 <div class=panel><table class=tbl><tr><th class=l>協会</th><th>優勝</th><th>準優勝</th><th>4強</th><th>決勝</th></tr>${rows.map(([k,v])=>{const c=D.countries[k]||[k,''];return `<tr class="click${k==='JPN'?' me':''}" data-c="${k}"><td class=l><span class=flag>${c[1]}</span>${esc(c[0])}</td><td><b>${v.t}</b></td><td>${v.r}</td><td>${v.b}</td><td>${v.t+v.r}</td></tr>`+(ST.copen===k?`<tr class=pdet><td colspan=5>${v.list.slice().reverse().map(e=>`<div data-ev="${e.k}" style="cursor:pointer;padding:2px 0">🏆 ${e.year} ${esc(e.title)}（${esc(e.ch[1])}）</div>`).join('')||'優勝なし'}</td></tr>`:'')}).join('')}</table></div>`;
}
function rLive(){
 const L=D.events.filter(e=>e.src==='sim'||e.status!=='done');
 const last=D.events.filter(e=>e.status==='done').slice(-3).reverse();
 return `<div class=summary>シミュレーションは実際の大会日程に合わせて毎日20時ごろ公開。公開前の試合は「未実施」と表示します（現在 ${md(D.revealed)} 分まで公開）。</div>`+L.map(evCard).join('')+`<h3>最近終わった大会</h3>`+last.map(evCard).join('');
}
function render(){
 const f={ev:rEv,jp:rJp,wr:rWr,ct:rCt,live:rLive}[ST.tab];
 $('main').innerHTML=f()+`<div class=foot>【仮想】このアプリの団体戦はすべて架空のシミュレーションです（実在の大会結果ではありません）。チームは各大会の男子シングルス出場者から協会ごとに3人ずつ編成。</div>`;
 bind();
 document.querySelectorAll('#main tr[data-p]').forEach(tr=>tr.onclick=()=>{const p=+tr.dataset.p;ST.wopen=ST.wopen===p?null:p;render()});
 document.querySelectorAll('#main tr[data-c]').forEach(tr=>tr.onclick=()=>{ST.copen=ST.copen===tr.dataset.c?null:tr.dataset.c;render()});
}
// ---- event detail ----
let EV=null,EVT='sum';
async function openEv(k,fromPop){
 if(!fromPop)history.pushState(null,'','#e='+encodeURIComponent(k));
 const s=D.events.find(e=>e.k===k);if(!s)return;
 $('ev').classList.add('on');document.body.style.overflow='hidden';
 $('evh').innerHTML=`<button class=bk id=bk>← 戻る</button><span class=t>${esc(s.host)} 【仮想】${esc(s.title)}</span>`;$('bk').onclick=()=>history.back();
 $('evb').innerHTML='<div class=panel>読み込み中…</div>';
 try{EV=evCache[k]||(evCache[k]=await (await fetch('vteam/ev/'+k+'.json?v='+encodeURIComponent(D.built))).json())}catch(e){$('evb').innerHTML='<div class=panel>読み込めませんでした</div>';return}
 EVT='sum';drawEv();$('ev').scrollTop=0;
}
function closeEv(){ $('ev').classList.remove('on');document.body.style.overflow='';}
function T(c){const t=EV.teams[c];return t?[c,t[0],t[1],t[2]]:null}
function tieHtml(m,lab){
 const h=T(m.h),a=T(m.a);const jp=(h&&h[3]==='JPN')||(a&&a[3]==='JPN');
 if(m.u){return `<div class="tie${jp?' jp':''}"><div class=lab>${esc(lab)}　${md(m.d)}</div><div class=hd><div class=h>${h?tn(h):'<span class=u>未定</span>'}</div><div class="sc u">未実施</div><div>${a?tn(a):'<span class=u>未定</span>'}</div></div></div>`}
 const hw=m.w===m.h;
 const rbs=m.rb.map(r=>`<div class=rb><span class=o>${esc(r[0])}</span><span class="h${r[5]===0?' w':''}" style="text-align:right">${esc(r[1])}</span><span class=gw>${r[3][0]}-${r[3][1]}</span><span class="r${r[5]===1?' w':''}">${esc(r[2])}</span><span class=g>${esc(r[4])}</span></div>`).join('');
 return `<div class="tie${jp?' jp':''}"><div class=lab>${esc(lab)}　${md(m.d)}</div><div class=hd><div class="h${hw?' w':''}">${tn(h)}</div><div class=sc>${m.s[0]}-${m.s[1]}</div><div class="${hw?'':'w'}">${tn(a)}</div></div><div class=rbs><div class=lu>オーダー：${esc(m.lu[0].join('／'))} − ${esc(m.lu[1].join('／'))}</div>${rbs}${m.n?`<div class=muted>${esc(m.n.join('／'))}</div>`:''}</div></div>`;
}
function drawEv(){
 const tabs=[['sum','概要'],['grp','グループ'],['ko','決勝T'],['tm','チーム']];
 if(!document.getElementById('evtabs'))$('evh').insertAdjacentHTML('beforeend','<div id=evtabs></div>');
 $('evtabs').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${EVT===k?'on':''}">${l}</button>`).join('');
 $('evtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{EVT=b.dataset.t;drawEv();$('ev').scrollTop=0});
 let h='';const e=EV;
 if(EVT==='sum'){
  h+=`<div class=panel><div><span class="chip v">仮想</span> ${esc(KIND[e.kind]||'')}　${esc(e.dates)}　${e.n}チーム</div>${e.note?`<div class=muted style="margin-top:4px">${esc(e.note)}</div>`:''}${e.sim?`<div class=muted style="margin-top:4px">毎日20時ごろ公開・${md(e.revealed)}分まで表示</div>`:''}
  <div class=best style="margin-top:8px">${e.ch?`<span class="chip gold">🏆 優勝 ${tn(e.ch)}</span><span class="chip silver">準優勝 ${tn(e.ru)}（決勝 ${e.fs.join('-')}）</span>`:stChip(e)}${e.b4.map(b=>`<span class="chip bronze">${esc(e.fin[b[0]])} ${tn(b)}</span>`).join('')}</div></div>`;
  const order=Object.keys(e.teams).sort((x,y)=>(e.teams[x][3]||99)-(e.teams[y][3]||99));
  h+=`<div class=panel><h3>最終成績</h3><table class=tbl><tr><th>シード</th><th class=l>チーム</th><th class=l>成績</th></tr>${order.map(c=>`<tr class="${e.teams[c][2]==='JPN'?'me':''}"><td>${e.teams[c][3]||''}</td><td class=l>${tn(T(c))}</td><td class=l>${esc(e.fin[c])}</td></tr>`).join('')}</table></div>`;
  const days=Object.entries(e.days||{});
  if(days.length)h+=`<div class=panel><h3>日程</h3>${days.map(([d,it])=>`<div class=muted>${md(d)}　${it.map(x=>/^G\d+$/.test(x)?'グループ第'+x.slice(1)+'戦':x).join('・')}${e.sim&&d>e.revealed?'（未公開）':''}</div>`).join('')}</div>`;
 }else if(EVT==='grp'){
  if(!e.groups.length)h+='<div class=panel>グループリーグなし（決勝のみ）</div>';
  for(const g of e.groups){
   h+=`<div class=panel><h3>${g.g}組${g.done?'':'（途中）'}</h3><table class=tbl><tr><th>#</th><th class=l>チーム</th><th>勝敗</th><th>試合</th><th>ゲーム</th></tr>${g.st.map((r,i)=>`<tr class="${g.done&&i<2&&e.ko.length&&e.groups.length>1?'q':''}${e.teams[r[0]][2]==='JPN'?' me':''}"><td>${i+1}</td><td class=l>${tn(T(r[0]))}</td><td>${r[1]}-${r[2]}</td><td>${r[3]}-${r[4]}</td><td>${r[5]}-${r[6]}</td></tr>`).join('')}</table>`;
   h+=g.ms.map(m=>tieHtml(m,`${g.g}組 第${m.r||''}戦`)).join('')+`</div>`;
  }
  h+='<div class=muted>スコアをタップで各シングルスのゲームスコア</div>';
 }else if(EVT==='ko'){
  for(const r of e.ko){h+=`<div class=panel><h3>${esc(r.name)}　${md(r.date)}</h3>${r.ms.map(m=>tieHtml(m,r.name)).join('')}</div>`}
  if(e.slots&&e.ko.length&&e.ko[0].ms.some(m=>m.u&&!m.h))h+=`<div class=muted>組み合わせ：${e.slots.map((s,i)=>(i%2?'−':(i?'、':''))+s[0]+'組'+s[1]+'位').join('')}</div>`;
 }else{
  const order=Object.keys(e.teams).sort((x,y)=>(e.teams[x][3]||99)-(e.teams[y][3]||99));
  h+=`<div class=panel>${order.map(c=>{const t=e.teams[c];return `<div class=roster><b>${tn(T(c))}</b> <span class=muted>シード${t[3]||'-'}・上位3人の世界ランク計 ${t[4]==null?'-':t[4]}</span><div class=pl>${t[5].map(p=>`${esc(p[0])}<span class=muted>（${p[1]==null?'ランクなし':p[1]+'位'}）</span>`).join('、')}</div></div>`}).join('')}<div class=muted style="margin-top:6px">世界ランクは大会時点。※は推定表記。</div></div>`;
 }
 $('evb').innerHTML=h+`<div class=foot>【仮想】架空のシミュレーションです</div>`;
 $('evb').querySelectorAll('.tie .hd').forEach(x=>x.onclick=()=>x.parentNode.classList.toggle('open'));
}
init();
</script>
</body>
</html>
