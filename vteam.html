<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【仮想】WTT団体戦</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1a2230;--sub:#667085;--line:#e3e7ee;--acc:#c8102e;--acc2:#1f4e78;--win:#c8102e;--winbg:#fff0f2;--lose:#4a6fa5;--losebg:#eef3fa;--chip:#eef2f7;--v:#7a3fb0;--jp:#fff5f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(31,78,120,.12)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit}
header{background:var(--acc2);color:#fff;padding:8px 10px 8px;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:6px}
header h1 .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 a{color:#e3eefb;font-size:12px;font-weight:400;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 10px;white-space:nowrap}
.vbadge{background:var(--v);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;flex:none}
.hsub{font-size:11px;color:#cfe0f5;margin:3px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:52px;min-height:40px;white-space:nowrap;background:rgba(255,255,255,.14);border:0;color:#fff;padding:6px 6px;border-radius:9px;font-size:14px;cursor:pointer}
.tab.on{background:#fff;color:var(--acc2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:10px}
.panel{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters label{display:flex;flex-direction:column;font-size:11.5px;color:var(--sub);gap:3px;min-width:0}
.filters .wide{grid-column:1/-1}
select,input[type=search],input[type=number]{width:100%;min-height:42px;padding:8px 10px;border:1px solid #cfd6e0;border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.summary{font-size:12.5px;color:var(--sub);margin:4px 4px 8px}
.tour{background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(16,24,40,.07);overflow:hidden;cursor:pointer}
.tour:active{background:#f7f9fc}
.th{padding:10px 12px;border-left:5px solid var(--acc2)}
.k-feeder{border-left-color:#8a96a8}.k-contender{border-left-color:#2a8f5b}.k-star{border-left-color:#e08a00}.k-smash{border-left-color:#c8102e}.k-champions{border-left-color:#6a4fb3}.k-finals,.k-cupfinals{border-left-color:#000}.k-worldcup{border-left-color:#0b7fa8}.k-worlds,.k-worldsteam{border-left-color:#b8860b}.k-mixedteam{border-left-color:#d1477a}
.th .nm{font-weight:700;font-size:15.5px;line-height:1.35}
.th .inf{font-size:12px;color:var(--sub);margin-top:2px}
.best{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.chip.gold{background:#fff2c2;color:#6b4e00}.chip.silver{background:#e7ebf1}.chip.bronze{background:#f8e4d4;color:#7a3f12}.chip.jp{background:#fde6ea;color:#9b0d22}.chip.live{background:#dff3e7;color:#17703f;font-weight:700}.chip.up{background:#eef0f3;color:#6b7484}.chip.v{background:#f1e8fa;color:var(--v);font-weight:700}
.ych{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.ych::-webkit-scrollbar{display:none}
.ych button{flex:1 0 auto;min-width:52px;min-height:36px;border:1px solid #c9d1dc;background:#fff;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:600;color:#33475b}.ych button.on{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
table{border-collapse:collapse;width:100%}
.tbl{font-size:14px}.tbl th{font-size:11.5px;color:var(--sub);font-weight:600;text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:9px 5px;border-bottom:1px solid #eef1f5;text-align:right;white-space:nowrap}
.tbl td.l,.tbl th.l{text-align:left;white-space:normal}.tbl tr.q td{background:#f0f7ff}.tbl tr.me td{background:var(--jp)}
.tbl tr.click{cursor:pointer}.tbl tr.click:active td{background:#eef3fa}
.tbl td b{font-size:15px}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.big div{background:var(--chip);border-radius:12px;padding:8px 2px}.big b{display:block;font-size:20px;line-height:1.2}.big span{font-size:11px;color:var(--sub)}
h2{font-size:16px;margin:2px 2px 10px}h3{font-size:14.5px;margin:4px 2px 8px;color:var(--acc2)}
.muted{color:var(--sub);font-size:12px}
.ovl{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ovl.on{display:block}
#ev{z-index:50}#pl{z-index:60}
.oh{position:sticky;top:0;background:var(--acc2);color:#fff;padding:8px 10px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.oh .row{display:flex;align-items:center;gap:8px}
.bk{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:9px;padding:0 12px;min-height:40px;font-size:14px;flex:none}
.oh .t{font-weight:700;font-size:15px;line-height:1.3;min-width:0}
#pl .oh{background:#2d3a4f}
#evtabs{display:flex;gap:5px;margin-top:7px}#evtabs button{flex:1;min-height:38px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:6px 2px;font-size:13.5px}#evtabs button.on{background:#fff;color:var(--acc2);font-weight:700}
.tie{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;overflow:hidden}
.tie .hd{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:8px 10px 10px;cursor:pointer;min-height:44px}
.tie .hd>div{min-width:0}
.tie .hd .h{text-align:right}.tie .sc{font-weight:800;font-size:18px;min-width:52px;text-align:center;letter-spacing:.5px}
.tie .hd .tw{font-weight:700;color:var(--win)}
.tie .hd .tl{color:#55606f}
.tie .lab{font-size:11.5px;color:var(--sub);padding:6px 10px 0;display:flex;justify-content:space-between}
.tie .lab .tg::after{content:'▼ 詳細';font-size:11px;color:#8a95a5}.tie.open .lab .tg::after{content:'▲ 閉じる'}
.tie .rbs{display:none;border-top:1px dashed var(--line);padding:6px 10px 10px;font-size:13.5px;background:#fbfcfe}.tie.open .rbs{display:block}
.rb{display:grid;grid-template-columns:30px 1fr 40px 1fr;gap:4px;padding:6px 0;border-bottom:1px solid #eef1f5;align-items:center}
.rb .o{font-size:11px;color:var(--sub)}.rb .g{grid-column:2/5;font-size:12px;color:var(--sub);text-align:center}.rb .gw{text-align:center;font-weight:800}
.rb .w{font-weight:700;color:var(--win)}
.rb .r{text-align:left}.rb .h{text-align:right}
.tie.jp{border-color:#f0a5b0;box-shadow:inset 4px 0 0 #e8475f}
.u{color:var(--sub);font-size:13px}
.lu{font-size:12px;color:var(--sub);padding:2px 0 6px;line-height:1.7}
.roster{font-size:13.5px;padding:10px 0;border-bottom:1px solid #eef1f5}.roster b{font-size:14.5px}.roster .pl{color:var(--ink);font-size:13.5px;margin-top:4px;line-height:2}
.click{cursor:pointer}
.foot{font-size:11px;color:var(--sub);text-align:center;padding:12px 0 36px}
.flag{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;margin-right:2px}
.pn{color:#1f56a8;text-decoration:underline;text-decoration-color:rgba(31,86,168,.35);text-underline-offset:3px;cursor:pointer;padding:2px 0}
.w .pn,.tw .pn{color:var(--win)}
.pn:active{background:#e6eefb;border-radius:4px}
.btn{display:inline-block;border:1px solid #c9d1dc;background:#fff;border-radius:10px;padding:0 14px;min-height:40px;font-size:14px;color:#33475b;cursor:pointer}
.btn.full{width:100%;margin-top:8px}
.wl{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:800;font-size:12px;padding:1px 4px}
.wl.W{background:var(--winbg);color:var(--win)}.wl.L{background:var(--losebg);color:var(--lose)}
.ml{padding:9px 0;border-bottom:1px solid #eef1f5;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start}
.ml .mx{min-width:0}.ml .ev{font-size:12px;color:var(--sub)}.ml .op{font-size:14.5px;margin:1px 0}.ml .gs{font-size:12px;color:var(--sub)}
.ml .sc{font-weight:800;font-size:16px;text-align:right}.ml .sc.W{color:var(--win)}.ml .sc.L{color:var(--lose)}
.bar{height:6px;border-radius:3px;background:var(--losebg);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--win)}
.pcard{padding:10px 0;border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
.pcard .nm{flex:1;min-width:0;font-weight:600}.pcard .st{font-size:12.5px;color:var(--sub);text-align:right}
.ph{display:flex;align-items:center;gap:10px}.ph .fl{font-size:34px;line-height:1}.ph .nm{font-size:20px;font-weight:800}.ph .ct{font-size:12.5px;color:var(--sub)}
@media(min-width:700px){.filters{grid-template-columns:repeat(4,1fr)}.big{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<header>
 <h1><span class="vbadge">仮想</span><span class=ttl>WTT団体戦（男子3人制）</span><a href="wtt.html">← 戦績アプリ</a></h1>
 <div class="hsub" id="hsub">読み込み中…</div>
 <div class="tabs">
  <button class="tab on" data-t="ev">大会</button>
  <button class="tab" data-t="jp">日本</button>
  <button class="tab" data-t="wr">勝率</button>
  <button class="tab" data-t="pl">選手</button>
  <button class="tab" data-t="ct">国別</button>
  <button class="tab" data-t="live">進行中</button>
 </div>
</header>
<main id="main"></main>
<div id="ev" class="ovl"><div id="evh" class="oh"></div><main id="evb"></main></div>
<div id="pl" class="ovl"><div id="plh" class="oh"></div><main id="plb"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={feeder:'フィーダー',contender:'コンテンダー',star:'スターコンテンダー',smash:'グランドスマッシュ',champions:'チャンピオンズ',finals:'ファイナルズ',cupfinals:'カップファイナルズ',worldcup:'ワールドカップ',worlds:'世界卓球（個人戦）',worldsteam:'世界卓球（団体戦）',mixedteam:'混合団体W杯'};
const TIER=[['','すべて'],['feeder','フィーダー'],['contender','コンテンダー'],['star','スターコンテンダー'],['smash','グランドスマッシュ'],['champions','チャンピオンズ'],['finals','ファイナルズ'],['worldcup','ワールドカップ'],['worlds','世界卓球'],['mixedteam','混合団体W杯']];
const TIERN=Object.fromEntries(TIER);
const tierOf=k=>k==='cupfinals'?'finals':k==='worldsteam'?'worlds':k;
let D=null,PIDX=new Map(),ST={tab:'ev',y:'',tier:'',q:'',jy:'',jt:'',wy:'',wt:'',wn:'JPN',wmin:10,wsort:'pct',cy:'',ctier:'',pq:'',pn:'',copen:null};
const evCache={},plCache={};
function md(d){return d?(+d.slice(5,7))+'/'+(+d.slice(8)):''}
function tn(t){return t?`<span class=flag>${t[2]}</span>${esc(t[1])}`:''}
function pct(w,l){return w+l?(100*w/(w+l)):0}
function pkey(name,nat){return name+'|'+nat}
// 選手名（タップで詳細）。データにない名前は普通の文字
function pn(name,nat){if(name==null)return '';return PIDX.has(pkey(name,nat))?`<span class=pn data-pn="${esc(pkey(name,nat))}">${esc(name)}</span>`:esc(name)}
function finCls(f){return f==='優勝'?'gold':f==='準優勝'?'silver':/ベスト4|3位|4位/.test(f)?'bronze':(f==='進行中'?'live':(f==='未実施'?'up':''))}
function stChip(s){return s.status==='live'?'<span class="chip live">進行中</span>':s.status==='upcoming'?'<span class="chip up">開催前</span>':''}
async function init(){
 try{const r=await fetch('vteam/index.json?v='+Date.now());D=await r.json();}catch(e){$('main').innerHTML='<div class=panel>データを読み込めませんでした</div>';return}
 D.events.forEach((e,i)=>e.i=i);
 D.players.forEach((p,i)=>PIDX.set(pkey(p[0],p[1]),i));
 const nd=D.events.filter(e=>e.status==='done').length;
 $('hsub').textContent=`【仮想】2021〜2026 全${D.events.length}大会（終了${nd}）・進行中は${md(D.revealed)}公開分まで・更新 ${D.built}`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
 // 選手名タップ → 詳細（どの画面からでも）
 document.addEventListener('click',ev=>{const x=ev.target.closest('[data-pn]');if(!x)return;ev.preventDefault();ev.stopPropagation();openPl(x.dataset.pn)},true);
 window.addEventListener('popstate',()=>route(true));
 render();route(true);
}
function setTab(t){ST.tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));render();window.scrollTo(0,0)}
// ハッシュ：#e=大会キー / #p=選手名|協会   （戻るボタン対応）
function route(){
 const h=location.hash;
 if(h.startsWith('#p=')){drawPl(decodeURIComponent(h.slice(3)));return}
 closePl();
 if(h.startsWith('#e=')){const k=decodeURIComponent(h.slice(3));if(!(EVK===k&&$('ev').classList.contains('on')))openEv(k,true)}
 else closeEv();
}
function lockBody(){document.body.style.overflow=($('ev').classList.contains('on')||$('pl').classList.contains('on'))?'hidden':''}
function years(){return [...new Set(D.events.map(e=>e.year))].sort()}
function ych(cur,key,ys){return `<div class=ych>`+[['','全期間'],...(ys||years()).map(y=>[String(y),y])].map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')+`</div>`}
function tierSel(cur,key){return `<label>大会グレード<select data-k="${key}">`+TIER.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')+`</select></label>`}
function natSel(cur,key,label,all){const nats=Object.entries(D.countries).sort((a,b)=>a[1][0].localeCompare(b[1][0],'ja'));return `<label>${label}<select data-k="${key}"><option value="">${all}</option>${nats.map(([k,v])=>`<option value="${k}"${cur===k?' selected':''}>${v[1]} ${esc(v[0])}</option>`).join('')}</select></label>`}
function bindIn(root,S,redraw){
 root.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(el.tagName==='BUTTON')el.onclick=()=>{S[k]=el.dataset.v;redraw()};
  else if(el.tagName==='SELECT')el.onchange=()=>{S[k]=el.value;redraw()};
  else el.oninput=()=>{S[k]=el.type==='number'?(+el.value||0):el.value;clearTimeout(bindIn.t);bindIn.t=setTimeout(()=>{redraw();const x=root.querySelector(`[data-k="${k}"]`);if(x){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(_){}}},250)};
 });
 root.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>openEv(el.dataset.ev));
}
function evMatch(e,y,t){return (!y||String(e.year)===y)&&(!t||tierOf(e.kind)===t)}
function evCard(e){
 const jp=e.jp.map(j=>`<span class="chip jp">🇯🇵${esc(j[1])}：${esc(j[2])}</span>`).join('');
 let res='';
 if(e.ch)res+=`<span class="chip gold">🏆 ${tn(e.ch)}</span><span class="chip silver">準 ${tn(e.ru)}</span>`+e.b4.map(b=>`<span class="chip bronze">4強 ${tn(b)}</span>`).join('');
 else res+=stChip(e);
 return `<div class=tour data-ev="${e.k}"><div class="th k-${e.kind}"><div class=nm>${esc(e.host)} ${esc(e.title)}</div><div class=inf>${e.year}　${esc(e.dates)}　${KIND[e.kind]||''}　${e.n}チーム</div><div class=best>${res}${jp}</div></div></div>`;
}
function rEv(){
 let L=D.events.filter(e=>evMatch(e,ST.y,ST.tier));
 if(ST.q){const q=ST.q.trim();L=L.filter(e=>(e.title+e.host+(e.ch?e.ch[1]:'')).includes(q))}
 L=L.slice().reverse();
 return `<div class=panel>${ych(ST.y,'y')}<div class=filters>${tierSel(ST.tier,'tier')}<label>大会名・優勝国で検索<input type=search data-k=q value="${esc(ST.q)}" placeholder="例：ドーハ、日本"></label></div></div>
 <div class=summary>${L.length}大会（新しい順）・タップで組み合わせと全試合</div>`+L.map(evCard).join('');
}
const FINORD=['優勝','準優勝','3位','4位','ベスト4','ベスト8'];
function aggregate(y,t,nat){
 const P={};
 for(const r of D.agg){
  if(y&&String(r[1])!==y)continue;if(t&&tierOf(r[2])!==t)continue;
  const p=D.players[r[0]];if(nat&&p[1]!==nat)continue;
  const a=P[r[0]]||(P[r[0]]={p:r[0],v:[0,0,0,0,0,0,0,0]});for(let i=0;i<8;i++)a.v[i]+=r[3+i];
 }
 return Object.values(P);
}
function pRow(a,extra){const p=D.players[a.p],c=D.countries[p[1]]||['',''];const m=a.v[0]+a.v[1],q=pct(a.v[0],a.v[1]);
 return `<div class=pcard data-pn="${esc(pkey(p[0],p[1]))}"><span class=flag>${c[1]}</span><div class=nm>${esc(p[0])}<div class=bar><i style="width:${q.toFixed(0)}%"></i></div></div><div class=st><b style="color:var(--ink);font-size:15px">${a.v[0]}-${a.v[1]}</b>（${q.toFixed(1)}%）<br>${extra||(m+'試合'+(a.v[6]?'・優勝'+a.v[6]:''))}</div></div>`}
function rJp(){
 const L=D.events.filter(e=>evMatch(e,ST.jy,ST.jt));
 const withJ=L.filter(e=>e.jp.length);
 const best=e=>{let b=99;e.jp.forEach(j=>{const i=FINORD.indexOf(j[2]);if(i>=0&&i<b)b=i});return b};
 const cnt=i=>withJ.filter(e=>best(e)===i).length;
 const t1=cnt(0),t2=cnt(1),t4=cnt(2)+cnt(3)+cnt(4),t8=cnt(5);
 const idx=new Set(L.map(e=>e.i));
 const jt=D.jties.filter(t=>idx.has(t[0]));
 const byC={};jt.forEach(t=>{const k=t[5];(byC[k]=byC[k]||{w:0,l:0,n:D.countries[k]});if(t[7]>t[8])byC[k].w++;else byC[k].l++});
 const cl=Object.entries(byC).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l));
 const tw=jt.filter(t=>t[7]>t[8]).length;
 const titles=withJ.filter(e=>best(e)===0).reverse();
 const jp=aggregate(ST.jy,ST.jt,'JPN').filter(a=>a.v[0]+a.v[1]>0).sort((a,b)=>(b.v[0]+b.v[1])-(a.v[0]+a.v[1])).slice(0,12);
 return `<div class=panel>${ych(ST.jy,'jy')}<div class=filters>${tierSel(ST.jt,'jt')}</div></div>
 <div class=panel><h2>🇯🇵 日本の成績 <span class="chip v">仮想</span></h2><div class=big><div><b>${t1}</b><span>優勝</span></div><div><b>${t2}</b><span>準優勝</span></div><div><b>${t4}</b><span>ベスト4</span></div><div><b>${t8}</b><span>ベスト8</span></div></div>
 <div class="muted" style="margin-top:8px">出場 ${withJ.length}大会／対象 ${L.length}大会（日本チームは協会の男子シングルス出場者が3人以上の大会のみ）・タイ ${tw}勝${jt.length-tw}敗</div></div>

 let h=`<div class=panel><div class=ph><span class="fl flag">${P.c[1]}</span><div><div class=nm>${esc(P.p[0])}</div><div class=ct>${esc(P.c[0])}・所属チーム：${Object.entries(teams).map(([n,k])=>esc(n)+'×'+k).join('、')||'-'}</div></div></div>
 <div class=big style="margin-top:10px"><div><b>${W}-${L}</b><span>通算 勝-敗</span></div><div><b>${pct(W,L).toFixed(1)}%</b><span>勝率</span></div><div><b>${tit.length}</b><span>優勝</span></div><div><b>${tit.length+fin.length}</b><span>決勝進出</span></div></div>
 <div class=muted style="margin-top:8px">出場 ${P.t.length}大会（試合あり ${played.size}）・ゲーム ${gW}-${gL}・すべて【仮想】団体戦のシングルス${D.revealed?`（進行中の大会は${md(D.revealed)}公開分まで）`:''}</div></div>`;
 h+=`<div class=panel><h3>絞り込み</h3>${ych(F.y,'y',ys)}<div class=filters>${tierSel(F.t,'t')}<label>相手の協会<select data-k=c><option value="">すべて</option>${oppNats.map(k=>{const v=D.countries[k]||[k,''];return `<option value="${k}"${F.c===k?' selected':''}>${v[1]} ${esc(v[0])}</option>`}).join('')}</select></label><label>結果<select data-k=r>${[['','勝ち・負け'],['W','勝ちのみ'],['L','負けのみ']].map(([v,l])=>`<option value="${v}"${F.r===v?' selected':''}>${l}</option>`).join('')}</select></label>${filt?`<label>&nbsp;<button class=btn id=pfclr>解除</button></label>`:''}</div>${filt?`<div style="margin-top:8px"><b>絞り込み結果：${fW}-${fL}（${pct(fW,fL).toFixed(1)}%）</b></div>`:''}</div>`;
 const yr=Object.keys(byY).sort().reverse().map(y=>({l:`${y}年 <span class=muted>${byY[y].e.size}大会</span>`,w:byY[y].w,lo:byY[y].lo}));
 h+=`<div class=panel><h3>年別</h3>${wlTbl(yr,'年')}</div>`;
 const tr=TIER.filter(([k])=>k&&byT[k]).map(([k,l])=>({l,w:byT[k].w,lo:byT[k].lo}));
 h+=`<div class=panel><h3>大会グレード別</h3>${wlTbl(tr,'グレード')}</div>`;
 const cr=Object.entries(byC).sort((a,b)=>(b[1].w+b[1].lo)-(a[1].w+a[1].lo)||b[1].w-a[1].w).map(([k,z])=>{const v=D.countries[k]||[k,''];return {l:`<span class=flag>${v[1]}</span>${esc(v[0])}`,w:z.w,lo:z.lo,cls:'click'+(k==='CHN'?' me':''),attr:` data-fc="${k}"`}});
 h+=`<div class=panel><h3>相手の協会別</h3><div class=muted>行をタップでその国との試合だけ表示</div>${wlTbl(cr,'相手')}</div>`;
 const orows=Object.entries(byO).sort((a,b)=>(b[1].w+b[1].lo)-(a[1].w+a[1].lo)||b[1].w-a[1].w);
 h+=`<div class=panel><h3>対戦相手別（${orows.length}人）</h3>${wlTbl(orows.slice(0,F.hn).map(([o,z])=>{const q=D.players[o]||['?',''];const v=D.countries[q[1]]||['',''];return {l:`<span class=flag>${v[1]}</span>${pn(q[0],q[1])}`,w:z.w,lo:z.lo}}),'相手')}${orows.length>F.hn?`<button class="btn full" id=hmore>もっと見る（あと${orows.length-F.hn}人）</button>`:''}</div>`;
 const ft=P.t.filter(t=>t[2]==='優勝'||t[2]==='準優勝').slice().reverse();
 h+=`<div class=panel><h3>🏆 優勝・準優勝（${tit.length}・${fin.length}）</h3>${ft.map(t=>{const e=ev(t[0]);const n=TM(t[0],t[1]);return `<div class="roster click" data-ev="${e.k}"><span class="chip ${finCls(t[2])}">${t[2]==='優勝'?'🏆 ':''}${t[2]}</span> <b>${e.year} ${esc(e.title)}</b><div class=muted><span class=flag>${n[1]}</span>${esc(n[0])}${e.fs&&t[2]==='優勝'?'・決勝 '+e.fs.join('-')+' '+tn(e.ru):''}${e.fs&&t[2]==='準優勝'?'・決勝 '+e.fs.slice().reverse().join('-')+' '+tn(e.ch):''}</div></div>`}).join('')||'<div class=muted>なし</div>'}</div>`;
 const ML=M.slice().sort((a,b)=>b[1].localeCompare(a[1])||b[0]-a[0]);
 h+=`<div class=panel><h3>試合ログ（新しい順・${ML.length}試合）</h3>${ML.slice(0,F.n).map(m=>{const e=ev(m[0]);const op=D.players[m[5]]||['?',''];const ot=TM(m[0],m[4]),mt=TM(m[0],m[3]);const R=m[9]?'W':'L';
  return `<div class=ml><span class="wl ${R}">${m[9]?'勝':'負'}</span><div class=mx><div class="ev click" data-ev="${e.k}">${md(m[1])}・${e.year} ${esc(e.title)}・${esc(m[2])}${m[10]?'（'+esc(m[10])+'）':''} ›</div><div class=op>vs <span class=flag>${ot[1]}</span>${pn(op[0],op[1])} <span class=muted>${esc(ot[0])}</span></div><div class=gs>${esc(m[8])}・タイ ${esc(mt[0])} ${m[11]}-${m[12]}</div></div><div class="sc ${R}">${m[6]}-${m[7]}</div></div>`}).join('')||'<div class=muted>試合なし</div>'}${ML.length>F.n?`<button class="btn full" id=mmore>もっと見る（あと${ML.length-F.n}試合）</button>`:''}</div>`;
 h+=`<div class=foot>【仮想】架空のシミュレーションです（実在の試合結果ではありません）</div>`;
 $('plb').innerHTML=h;
 const rd=()=>{F.n=50;drawPlBody()};
 bindIn($('plb'),F,rd);
 $('plb').querySelectorAll('[data-fc]').forEach(x=>x.onclick=()=>{F.c=F.c===x.dataset.fc?'':x.dataset.fc;rd()});
 const hm=$('hmore');if(hm)hm.onclick=()=>{F.hn+=30;drawPlBody()};
 const mm=$('mmore');if(mm)mm.onclick=()=>{F.n+=100;drawPlBody()};
 const cl=$('pfclr');if(cl)cl.onclick=()=>{F.y=F.t=F.c=F.r='';rd()};
}
init();
</script>
</body>
</html>
