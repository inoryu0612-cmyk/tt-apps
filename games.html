<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲームイベント予定</title>
<style>
:root{--ink:#1d2533;--sub:#6b7484;--line:#e2e6ec;--acc:#1f4e78;--red:#e03131}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#fff;color:var(--ink);font-size:16px;line-height:1.45}
header{background:var(--acc);color:#fff;padding:10px 12px 8px;position:sticky;top:0;z-index:30}
header h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 small{font-weight:400;font-size:11px;opacity:.8;margin-left:auto}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 4px;border-radius:8px;font-size:15px;cursor:pointer}
.tab.on{background:#fff;color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.chip.pred{--c:#868e96;border-style:dashed}
main{max-width:760px;margin:0 auto;padding-bottom:30px}
h2{font-size:16px;margin:16px 12px 6px;color:var(--acc)}
h2 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.card{display:flex;align-items:center;gap:10px;margin:0 10px 8px;padding:10px 12px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;cursor:pointer;background:#fff}
.card.pr{border-style:dashed;border-left-style:dashed;background:#fafafa}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.cb{flex:1;min-width:0}
.cg{font-size:12.5px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:5px}
.ct{font-size:15.5px;font-weight:600;line-height:1.35;margin-top:1px}
.card.pr .ct{color:#6b7484;font-weight:500}
.cd2{font-size:12.5px;color:var(--sub);margin-top:2px}
.big{flex:none;text-align:right;min-width:74px}
.big b{display:block;font-size:22px;line-height:1.1;color:var(--acc)}
.big b.r{color:var(--red)}
.big span{font-size:11px;color:var(--sub)}
.tag{font-size:11px;border:1px dashed #868e96;color:#6b7484;border-radius:4px;padding:0 4px;font-weight:400}
.empty{color:var(--sub);font-size:14px;padding:4px 14px}
.tl{overflow-x:auto;position:relative;-webkit-overflow-scrolling:touch}
.tlin{position:relative}
.axis{position:relative;z-index:12;background:#fff;border-bottom:1px solid var(--line);height:46px}
.mlab{position:absolute;top:2px;font-size:12px;font-weight:700;color:var(--acc);white-space:nowrap;padding-left:3px;border-left:1px solid #adb5bd}
.dlab{position:absolute;top:19px;font-size:12px;line-height:1.05;text-align:center;color:var(--ink);padding:1px 0}
.dlab.su{color:#e03131}.dlab.sa{color:#1c7ed6}
.dlab.td{background:var(--red);color:#fff;border-radius:6px;font-weight:700}
.wkd{position:absolute;top:0;bottom:0;background:#f8f9fa}
.vline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:11;pointer-events:none}
.gsec{position:relative;border-bottom:1px solid var(--line)}
.ghead{position:relative;height:28px}
.glab{position:sticky;left:0;display:inline-flex;align-items:center;gap:6px;height:24px;margin-top:4px;padding:0 12px 0 8px;background:var(--c);color:#fff;font-weight:700;font-size:14px;border-radius:0 12px 12px 0;z-index:9}
.bar{position:absolute;height:22px;border-radius:5px;background:var(--c);color:#fff;font-size:12.5px;line-height:22px;padding:0 6px;white-space:nowrap;cursor:pointer;z-index:5;overflow:clip}
.bar span{position:sticky;left:4px;font-weight:600}
.bar.pr{background:repeating-linear-gradient(135deg,#f1f3f5 0 6px,#e9ecef 6px 12px);border:1.5px dashed #868e96;color:#495057;line-height:19px}
.bar.lt{border-top-left-radius:0;border-bottom-left-radius:0}
.lbl{position:absolute;white-space:nowrap;font-size:12.5px;line-height:22px;color:var(--ink);cursor:pointer;z-index:6;font-weight:600}
.lbl.pr{color:#6b7484;font-weight:500}
.dia{position:absolute;width:14px;height:14px;transform:rotate(45deg);background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--c);cursor:pointer;z-index:7}
.dia.pr{background:#fff;border:2px dashed #868e96;box-shadow:none}
.dia.sm{width:10px;height:10px}
.legend{font-size:12px;color:var(--sub);padding:6px 12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:3px}
.todaybtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:13px;margin-left:auto;cursor:pointer}
.gl{margin:0 10px 6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gr{display:flex;gap:10px;padding:8px 12px;border-top:1px solid #f1f3f5;cursor:pointer;align-items:flex-start;border-left:4px solid var(--c)}
.gr:first-child{border-top:0}
.gr .dt{flex:none;width:96px;font-size:13px;color:var(--sub);line-height:1.35}
.gr .dt b{color:var(--ink);font-size:14px}
.gr .tt{flex:1;font-size:15px}
.gr .tt small{display:block;font-size:12px;color:var(--sub)}
.gr.past{opacity:.45}
.gr.pr{border-left-style:dashed}.gr.pr .tt{color:#6b7484}
.foot{font-size:12px;color:var(--sub);padding:14px 12px;line-height:1.6}
.foot a{color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px 16px 22px;max-height:80vh;overflow:auto}
.sheet .g{font-size:13px;font-weight:700;color:var(--c)}
.sheet h3{margin:4px 0 8px;font-size:17px}
.sheet table{font-size:14px;border-collapse:collapse;width:100%}
.sheet td{padding:5px 0;vertical-align:top;border-bottom:1px solid #f1f3f5}
.sheet td:first-child{color:var(--sub);width:72px;white-space:nowrap}
.sheet a.src{display:block;margin-top:12px;text-align:center;background:var(--acc);color:#fff;border-radius:8px;padding:10px;text-decoration:none;font-weight:700}
.sheet .x{float:right;border:0;background:none;font-size:22px;color:var(--sub);cursor:pointer}
.stat{font-weight:700}.stat.p{color:#6b7484}.stat.c{color:#2b8a3e}
</style>
</head>

const G=D.meta.games,EV=D.events,DAY=864e5,WD='日月火水木金土';
const ICON={ww:'🌊',hsr:'🚂',pad:'🐉',dna:'🌙',nte:'🏙️'};
const TY={version:'バージョン',gacha:'ガチャ',event:'イベント',login:'ログボ',maintenance:'メンテ',live:'生放送',reset:'更新',collab:'コラボ',offline:'リアル'};
document.getElementById('upd').textContent='更新 '+D.meta.updated;
function pd(s){return new Date(s.length===10?s+'T00:00:00+09:00':s)}
function jst(d){return new Date(d.getTime()+9*36e5)}
function jd(d){const j=jst(d);return Date.UTC(j.getUTCFullYear(),j.getUTCMonth(),j.getUTCDate())/DAY}
EV.forEach(e=>{e.s=pd(e.start);e.e=e.end?(e.end_all_day?new Date(pd(e.end).getTime()+DAY):pd(e.end)):null;e.c=G[e.game_key].color;e.pr=e.status==='predicted';
  e.sd=jd(e.s);e.ed=e.e?jd(new Date(e.e.getTime()-1)):e.sd;
  e.point=!e.e||['version','live','reset','maintenance'].includes(e.type);});
function fmt(d,allday){const j=jst(d);let s=(j.getUTCMonth()+1)+'/'+j.getUTCDate()+'('+WD[j.getUTCDay()]+')';if(!allday)s+=' '+j.getUTCHours()+':'+String(j.getUTCMinutes()).padStart(2,'0');return s}
function endTxt(e){return fmt(new Date(e.e.getTime()-(e.end_all_day?DAY:0)),e.end_all_day)}
function range(e){return fmt(e.s,e.start_all_day)+(e.end?' 〜 '+endTxt(e):'')}
function cnt(ms){const d=Math.floor(ms/DAY);if(d>=1)return d+'日';const h=Math.floor(ms/36e5);if(h>=1)return h+'時間';return Math.max(1,Math.floor(ms/6e4))+'分'}
let on=new Set(Object.keys(G)),showPred=true,view='now';
const ch=document.getElementById('chips');
for(const k in G){const b=document.createElement('button');b.className='chip on';b.style.setProperty('--c',G[k].color);b.textContent=ICON[k]+' '+G[k].name;b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);b.classList.toggle('on');render()};ch.appendChild(b)}
const pb=document.createElement('button');pb.className='chip pred on';pb.textContent='予想を表示';pb.onclick=()=>{showPred=!showPred;pb.classList.toggle('on');render()};ch.appendChild(pb);
function vis(){return EV.filter(e=>on.has(e.game_key)&&(showPred||!e.pr))}
function gtag(e){return `<span class="cg"><span class="dot"></span>${G[e.game_key].name}・${TY[e.type]||e.type}${e.pr?' <span class="tag">予想</span>':''}</span>`}
function renderNow(){
  const now=new Date(),ev=vis();
  const doing=ev.filter(e=>e.e&&e.s<=now&&e.e>now&&e.type!=='version').sort((a,b)=>a.e-b.e);
  const soon=ev.filter(e=>e.s>now&&e.s-now<=14*DAY).sort((a,b)=>a.s-b.s);
  let h=`<h2>🔥 いまやること<small>終了が近い順・${doing.length}件</small></h2>`;
  h+=doing.length?doing.map(e=>{const ms=e.e-now;return `<div class="card${e.pr?' pr':''}" style="--c:${e.c}" data-id="${e.id}"><div class="cb">${gtag(e)}<div class="ct">${e.title}</div><div class="cd2">終了 ${endTxt(e)}</div></div><div class="big"><span>あと</span><b class="${ms<=3*DAY?'r':''}">${cnt(ms)}</b></div></div>`}).join(''):'<div class="empty">なし</div>';
  h+=`<h2>⏭ もうすぐ始まる<small>14日以内・${soon.length}件</small></h2>`;
  h+=soon.length?soon.map(e=>`<div class="card${e.pr?' pr':''}" style="--c:${e.c}" data-id="${e.id}"><div class="cb">${gtag(e)}<div class="ct">${e.pr?'（予想）':''}${e.title}</div><div class="cd2">開始 ${fmt(e.s,e.start_all_day)}${e.end?' 〜 '+endTxt(e):''}</div></div><div class="big"><b>${cnt(e.s-now)}</b><span>後に開始</span></div></div>`).join(''):'<div class="empty">なし</div>';
  document.getElementById('v-now').innerHTML=h;
}
const DW=30,LH=28,BACK=14;
let tlFirst=true;
function tw(t){let w=0;for(const c of t)w+=/[\x00-\x7f]/.test(c)?7.3:12.8;return w}
function renderTL(){
  const now=new Date(),td=jd(now),from=td-BACK,to=td+70,days=to-from+1,W=days*DW;
  const x=d=>(d-from)*DW;
  let ax='',bg='';
  for(let d=from;d<=to;d++){const dt=new Date(d*DAY),wd=dt.getUTCDay(),md=dt.getUTCDate();
    if(md===1||d===from)ax+=`<div class="mlab" style="left:${x(d)}px">${dt.getUTCFullYear()}年${dt.getUTCMonth()+1}月</div>`;
    ax+=`<div class="dlab ${wd===0?'su':wd===6?'sa':''}${d===td?' td':''}" style="left:${x(d)+2}px;width:${DW-4}px">${md}<br><span style="font-size:10px">${WD[wd]}</span></div>`;
    if(wd===0||wd===6)bg+=`<div class="wkd" style="left:${x(d)}px;width:${DW}px"></div>`;}
  let body='';
  for(const k in G){if(!on.has(k))continue;
    const cur=vis().find(e=>e.game_key===k&&e.type==='version'&&e.e&&e.s<=now&&e.e>now);const curl=cur?(cur.title.match(/Ver\.[\d.]+/)||[cur.title.replace(/バージョン$/,'')])[0]+' 開催中（〜'+endTxt(cur).replace(/\(.\).*/,'')+'）':'';
    const ev=vis().filter(e=>e.game_key===k&&e.ed>=from&&e.sd<=to&&!(e.point&&e.sd<td-3)).sort((a,b)=>(a.point-b.point)||a.sd-b.sd||(b.ed-b.sd)-(a.ed-a.sd));
    const lanes=[];let items='';
    for(const e of ev){
      const txt=(e.pr?'（予想）':'')+e.title;let x1,x2,inside=false,a,b;
      if(e.point){x1=x(e.sd)+DW/2-9;x2=x(e.sd)+DW/2+12+tw(txt)}
      else{a=Math.max(x(e.sd),0);b=x(e.ed)+DW;const va=Math.max(a,x(td)-3*DW);inside=tw(txt)+14<=b-va;x1=a;x2=inside?b:b+4+tw(txt)}
      let l=0;while(lanes[l]&&lanes[l].some(r=>!(x2+6<=r[0]||x1>=r[1]+6)))l++;(lanes[l]=lanes[l]||[]).push([x1,x2]);
      const top=28+l*LH+3;
      if(e.point){const sm=e.type==='reset';items+=`<div class="dia${e.pr?' pr':''}${sm?' sm':''}" style="--c:${e.c};left:${x(e.sd)+DW/2-(sm?5:7)}px;top:${top+(sm?6:4)}px" data-id="${e.id}"></div><div class="lbl${e.pr?' pr':''}" style="left:${x(e.sd)+DW/2+12}px;top:${top}px" data-id="${e.id}">${txt}</div>`}
      else{items+=`<div class="bar${e.pr?' pr':''}${e.sd<from?' lt':''}" style="--c:${e.c};left:${a}px;width:${b-a-2}px;top:${top}px" data-id="${e.id}">${inside?'<span>'+txt+'</span>':''}</div>`;
        if(!inside)items+=`<div class="lbl${e.pr?' pr':''}" style="left:${b+3}px;top:${top}px" data-id="${e.id}">${txt}</div>`}
    }
    const H=28+Math.max(1,lanes.length)*LH+8;
    body+=`<div class="gsec" style="--c:${G[k].color};height:${H}px;width:${W}px"><div class="ghead"><span class="glab">${ICON[k]} ${G[k].name}${curl?'<span style="font-weight:400;font-size:12.5px;opacity:.95">｜'+curl+'</span>':''}</span></div>${items}</div>`;
  }
  const el=document.getElementById('tlbox'),sl=el.scrollLeft;
  const nowx=x(td)+((now-new Date(td*DAY-9*36e5))/DAY)*DW;
  el.innerHTML=`<div class="tlin" style="width:${W}px"><div class="axis">${ax}</div><div style="position:relative">${bg}${body}<div class="vline" style="left:${nowx-1}px"></div></div></div>`;
  if(tlFirst){el.scrollLeft=x(td)-DW*3;tlFirst=false}else el.scrollLeft=sl;
}
document.getElementById('gotoday').onclick=()=>document.getElementById('tlbox').scrollTo({left:(BACK-3)*DW,behavior:'smooth'});
function renderGame(){
  const now=new Date();let h='';
  for(const k in G){if(!on.has(k))continue;const ev=vis().filter(e=>e.game_key===k).sort((a,b)=>a.s-b.s||a.e-b.e);
    h+=`<h2 style="color:${G[k].color}">${ICON[k]} ${G[k].name}<small>${G[k].server}</small></h2><div class="gl" style="--c:${G[k].color}">`;
    h+=ev.map(e=>{const past=e.e?e.e<=now:e.sd<jd(now);let st;if(e.s>now)st=cnt(e.s-now)+'後に開始';else if(e.e&&e.e>now)st='開催中・あと'+cnt(e.e-now);else if(past)st='終了';else st='今日';
      return `<div class="gr${past?' past':''}${e.pr?' pr':''}" data-id="${e.id}"><div class="dt"><b>${fmt(e.s,e.start_all_day)}</b>${e.end?'<br>〜'+endTxt(e):''}</div><div class="tt">${e.pr?'<span class="tag">予想</span> ':''}${e.title}<small>${TY[e.type]||e.type}・${st}</small></div></div>`}).join('');
    h+='</div>'}
  document.getElementById('v-game').innerHTML=h||'<div class="empty">ゲームが選択されていません</div>';
}
function render(){({now:renderNow,tl:renderTL,game:renderGame})[view]()}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===v));for(const s of['now','tl','game'])document.getElementById('v-'+s).hidden=s!==v;render()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
document.body.addEventListener('click',ev=>{const r=ev.target.closest('[data-id]');if(r)show(r.dataset.id)});
function show(id){const e=EV.find(x=>x.id===id),n=new Date();const s=document.getElementById('sheet');s.style.setProperty('--c',e.c);
  s.innerHTML=`<button class="x" onclick="hide()">×</button><div class="g">${G[e.game_key].name}・${TY[e.type]||e.type}</div><h3>${e.pr?'（予想）':''}${e.title}</h3><table>
  <tr><td>期間</td><td>${range(e)}（JST）</td></tr>
  <tr><td>状態</td><td><span class="stat ${e.pr?'p':'c'}">${e.pr?'予想（未発表・周期からの推定）':'確定（公式/攻略サイト発表）'}</span></td></tr>
  <tr><td>残り</td><td>${e.s>n?cnt(e.s-n)+'後に開始':(e.e&&e.e>n?'あと'+cnt(e.e-n)+'で終了':(e.e?'終了済み':'—'))}</td></tr>
  <tr><td>サーバー</td><td>${e.server}</td></tr>${e.note?`<tr><td>メモ</td><td>${e.note}</td></tr>`:''}</table>
  <a class="src" href="${e.source}" target="_blank" rel="noopener">出典を開く ↗</a>`;
  document.getElementById('ov').classList.add('show')}
function hide(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')hide()});
setView({'#tl':'tl','#game':'game'}[location.hash]||'now');
setInterval(()=>{if(view!=='tl')render()},60000);
</script>
