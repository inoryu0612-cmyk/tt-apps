<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲームイベント予定</title>
<style>
:root{--bg:#fff;--ink:#1d2533;--sub:#6b7484;--line:#e2e6ec;--acc:#1f4e78;--chip:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
header{background:var(--acc);color:#fff;padding:10px 12px 8px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 small{font-weight:400;font-size:11px;opacity:.8;margin-left:auto}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;background:rgba(255,255,255,.15);border:0;color:#fff;padding:7px 6px;border-radius:8px;font-size:14px;cursor:pointer}
.tab.on{background:#fff;color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:84px;z-index:15;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.chip.on{background:var(--c);color:#fff}
.chip.pred{--c:#868e96;border-style:dashed}
main{max-width:760px;margin:0 auto;padding:0 0 40px}
h2{font-size:13px;margin:14px 12px 4px;color:var(--acc);display:flex;align-items:center;gap:6px}
h2 .n{font-weight:400;color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.row:active{background:#f4f6f9}
.bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.body{flex:1;min-width:0}
.ttl{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--sub);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.gt{color:var(--c);font-weight:700}
.ty{background:var(--chip);border-radius:4px;padding:0 4px;font-size:10.5px}
.cd{flex:none;font-size:12px;font-weight:700;color:#c92a2a;text-align:right;min-width:56px}
.cd.up{color:var(--acc)}
.cd small{display:block;font-weight:400;color:var(--sub);font-size:10px}
.row.pr .ttl{color:#6b7484;font-weight:500}
.row.pr .bar{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.badge{font-size:10px;border:1px dashed #868e96;color:#6b7484;border-radius:4px;padding:0 4px;flex:none}
.empty{color:var(--sub);font-size:12px;padding:6px 12px}
.foot{font-size:11px;color:var(--sub);padding:12px;line-height:1.6}
.foot a{color:var(--acc)}
/* calendar */
.mnav{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
.mnav b{font-size:15px}
.mnav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:16px;cursor:pointer}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--sub);text-align:center;border-bottom:1px solid var(--line)}
.wd div:first-child{color:#c92a2a}.wd div:last-child{color:#1c7ed6}
.week{position:relative;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border-right:1px solid #f1f3f5;font-size:11px;padding:2px 3px;cursor:pointer}
.day:last-child{border-right:0}
.day.o{color:#ced4da}
.day.t .dn{background:var(--acc);color:#fff;border-radius:50%;display:inline-block;width:18px;height:18px;text-align:center;line-height:18px}
.day.sel{background:#e7f0fa}
.more{position:absolute;font-size:9.5px;color:var(--sub);text-align:center}
.cb{position:absolute;height:13px;font-size:9.5px;line-height:13px;color:#fff;background:var(--c);border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;cursor:pointer}
.cb.pr{background:#fff;color:#6b7484;border:1px dashed var(--c);line-height:11px}
.cb.cl{border-top-left-radius:0;border-bottom-left-radius:0}.cb.cr{border-top-right-radius:0;border-bottom-right-radius:0}
#daylist h2{margin-top:10px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px 16px 22px;max-height:80vh;overflow:auto}
.sheet .g{font-size:12px;font-weight:700;color:var(--c)}
.sheet h3{margin:4px 0 8px;font-size:16px}
.sheet table{font-size:13px;border-collapse:collapse;width:100%}
.sheet td{padding:4px 0;vertical-align:top;border-bottom:1px solid #f1f3f5}
.sheet td:first-child{color:var(--sub);width:72px;white-space:nowrap}
.sheet a.src{display:block;margin-top:12px;text-align:center;background:var(--acc);color:#fff;border-radius:8px;padding:9px;text-decoration:none;font-weight:700}
.sheet .x{float:right;border:0;background:none;font-size:20px;color:var(--sub);cursor:pointer}
.stat{font-weight:700}.stat.p{color:#6b7484}.stat.c{color:#2b8a3e}
</style>
</head>
<body>
<header>
  <h1>🎮 ゲームイベント予定 <small id="upd"></small></h1>
  <div class="tabs"><button class="tab on" data-v="list">今日・今週・開催中</button><button class="tab" data-v="cal">カレンダー</button></div>

<div class="chips" id="chips"></div>
<main>

  <div id="cal" hidden>
    <div class="mnav"><button id="prev">‹</button><b id="mt"></b><button id="next">›</button></div><div style="padding:0 10px 6px;display:flex;gap:6px;font-size:12px;align-items:center"><button class="chip on" id="major" style="--c:#1f4e78">主要のみ（バージョン・ガチャ・放送・コラボ）</button></div>
    <div class="wd"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div id="grid"></div>
    <div id="daylist"></div>
  </div>

</main>

function fmt(d,allday){const j=jst(d);let s=(j.getUTCMonth()+1)+'/'+j.getUTCDate()+'('+WD[j.getUTCDay()]+')';if(!allday)s+=' '+j.getUTCHours()+':'+String(j.getUTCMinutes()).padStart(2,'0');return s}
function range(e){let s=fmt(e.s,e.start_all_day);if(e.end){s+=' 〜 '+fmt(new Date(e.e.getTime()-(e.end_all_day?DAY:0)),e.end_all_day)}return s}
function left(ms){if(ms<0)return'';const d=Math.floor(ms/DAY);if(d>=1)return'あと'+d+'日';const h=Math.floor(ms/36e5);if(h>=1)return'あと'+h+'時間';return'あと'+Math.max(1,Math.floor(ms/6e4))+'分'}
function until(ms){const d=Math.floor(ms/DAY);if(d>=1)return d+'日後';const h=Math.floor(ms/36e5);return h>=1?h+'時間後':'まもなく'}
let on=new Set(Object.keys(G)),showPred=true,view='list';
// chips
const ch=document.getElementById('chips');
for(const k in G){const b=document.createElement('button');b.className='chip on';b.style.setProperty('--c',G[k].color);b.textContent=G[k].name;b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);b.classList.toggle('on');render()};ch.appendChild(b)}
const pb=document.createElement('button');pb.className='chip pred on';pb.textContent='予想を表示';pb.onclick=()=>{showPred=!showPred;pb.classList.toggle('on');render()};ch.appendChild(pb);
function vis(){return EV.filter(e=>on.has(e.game_key)&&(showPred||e.status!=='predicted'))}
function row(e,now,mode){
  const pr=e.status==='predicted';let cd='',cls='cd';
  if(e.s>now){cd=until(e.s-now)+'<small>開始</small>';cls+=' up'}
  else if(e.e&&e.e>now){cd=left(e.e-now)+'<small>で終了</small>'}
  else if(!e.e&&e.sd===jd(now)){cd='今日';cls+=' up'}
  return `<div class="row${pr?' pr':''}" style="--c:${e.c}" data-id="${e.id}"><div class="bar"></div><div class="body"><div class="ttl">${e.title}</div><div class="meta"><span class="gt">${e.game}</span><span class="ty">${TY[e.type]||e.type}</span>${pr?'<span class="badge">予想</span>':''}<span>${range(e)}</span></div></div><div class="${cls}">${cd}</div></div>`}
function sec(t,arr,now,empty){return `<h2>${t} <span class="n">${arr.length}件</span></h2>`+(arr.length?arr.map(e=>row(e,now)).join(''):`<div class="empty">${empty||'なし'}</div>`)}
function renderList(){
  const now=new Date(),td=jd(now),ev=vis();
  const today=ev.filter(e=>e.sd===td||(e.e&&e.ed===td&&e.e>now));
  const week=ev.filter(e=>!today.includes(e)&&((e.s>now&&e.sd<=td+7)||(e.e&&e.e>now&&e.ed<=td+7)));
  const ongoing=ev.filter(e=>e.s<=now&&e.e&&e.e>now&&!today.includes(e)&&!week.includes(e)).sort((a,b)=>a.e-b.e);
  const upcoming=ev.filter(e=>e.s>now&&e.sd>td+7).sort((a,b)=>a.s-b.s);
  week.sort((a,b)=>Math.min(a.s>now?a.s:Infinity,a.e&&a.e>now?a.e:Infinity)-Math.min(b.s>now?b.s:Infinity,b.e&&b.e>now?b.e:Infinity));
  document.getElementById('list').innerHTML=sec('📌 今日（開始・終了）',today,now)+sec('🗓 今週（7日以内に開始・終了）',week,now)+sec('🔥 開催中（上記以外・終了が近い順）',ongoing,now)+sec('⏭ これから（8日目以降）',upcoming,now);
}
let cm,cy,sel=null,major=true;const PRI={version:0,gacha:1,live:2,collab:2,maintenance:2,offline:3,reset:4,login:5,event:5};{const j=jst(new Date());cy=j.getUTCFullYear();cm=j.getUTCMonth()}
function renderCal(){
  document.getElementById('mt').textContent=cy+'年'+(cm+1)+'月';
  const first=Date.UTC(cy,cm,1)/DAY,dow=new Date(first*DAY).getUTCDay(),start=first-dow;
  const last=Date.UTC(cy,cm+1,0)/DAY,weeks=Math.ceil((last-start+1)/7),td=jd(new Date()),ev=vis().filter(e=>!major||PRI[e.type]<=2).sort((a,b)=>(PRI[a.type]-PRI[b.type])||a.sd-b.sd||(b.ed-b.sd)-(a.ed-a.sd));
  const LANES=7,LH=15,TOP=18;let h='';
  for(let w=0;w<weeks;w++){
    const ws=start+w*7,we=ws+6;const lanes=[];const segs=[];const over=Array(7).fill(0);
    for(const e of ev){if(e.ed<ws||e.sd>we)continue;const a=Math.max(e.sd,ws),b=Math.min(e.ed,we);
      let l=0;while(lanes[l]&&lanes[l].some(x=>!(b<x[0]||a>x[1])))l++;
      if(l>=LANES){for(let d=a;d<=b;d++)over[d-ws]++;continue}
      (lanes[l]=lanes[l]||[]).push([a,b]);segs.push({e,a,b,l})}
    const H=TOP+LANES*LH+14;
    h+=`<div class="week" style="height:${H}px"><div class="days" style="height:100%">`;
    for(let d=0;d<7;d++){const n=ws+d,dt=new Date(n*DAY),o=dt.getUTCMonth()!==cm;h+=`<div class="day${o?' o':''}${n===td?' t':''}${n===sel?' sel':''}" data-d="${n}"><span class="dn">${dt.getUTCDate()}</span></div>`}
    h+='</div>';
    for(const s of segs){const L=(s.a-ws)/7*100,W=(s.b-s.a+1)/7*100;const pr=s.e.status==='predicted';
      h+=`<div class="cb${pr?' pr':''}${s.a>s.e.sd?' cl':''}${s.b<s.e.ed?' cr':''}" data-id="${s.e.id}" style="--c:${s.e.c};left:calc(${L}% + 1px);width:calc(${W}% - 2px);top:${TOP+s.l*LH}px">${s.a===s.e.sd||s.a===ws?s.e.title:''}</div>`}
    over.forEach((c,d)=>{if(c)h+=`<div class="more" style="left:${d/7*100}%;width:${100/7}%;top:${TOP+LANES*LH-1}px">+${c}</div>`});
    h+='</div>'}
  document.getElementById('grid').innerHTML=h;
  const dl=document.getElementById('daylist');
  if(sel!==null){const now=new Date(),arr=vis().filter(e=>e.sd<=sel&&e.ed>=sel).sort((a,b)=>a.s-b.s);const dt=new Date(sel*DAY);
    dl.innerHTML=sec((dt.getUTCMonth()+1)+'/'+dt.getUTCDate()+'('+WD[dt.getUTCDay()]+') の予定',arr,now)}else dl.innerHTML='<div class="empty">日付をタップするとその日の予定一覧を表示します。</div>';
}
function render(){view==='list'?renderList():renderCal()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');view=t.dataset.v;document.getElementById('list').hidden=view!=='list';document.getElementById('cal').hidden=view!=='cal';render()});
document.getElementById('major').onclick=function(){major=!major;this.classList.toggle('on');renderCal()};
document.getElementById('prev').onclick=()=>{cm--;if(cm<0){cm=11;cy--}render()};
document.getElementById('next').onclick=()=>{cm++;if(cm>11){cm=0;cy++}render()};
document.body.addEventListener('click',ev=>{const r=ev.target.closest('[data-id]');if(r){show(r.dataset.id);return}const d=ev.target.closest('[data-d]');if(d){sel=+d.dataset.d;renderCal()}});
function show(id){const e=EV.find(x=>x.id===id),pr=e.status==='predicted';const s=document.getElementById('sheet');s.style.setProperty('--c',e.c);
  s.innerHTML=`<button class="x" onclick="hide()">×</button><div class="g">${e.game}・${TY[e.type]||e.type}</div><h3>${pr?'（予想）':''}${e.title}</h3><table>
  <tr><td>期間</td><td>${range(e)}（JST）</td></tr>
  <tr><td>状態</td><td><span class="stat ${pr?'p':'c'}">${pr?'予想（未発表・周期からの推定）':'確定（公式/攻略サイト発表）'}</span></td></tr>
  <tr><td>残り</td><td>${(()=>{const n=new Date();return e.s>n?until(e.s-n)+'に開始':(e.e&&e.e>n?left(e.e-n)+'で終了':(e.e?'終了済み':'—'))})()}</td></tr>
  <tr><td>サーバー</td><td>${e.server}</td></tr>${e.note?`<tr><td>メモ</td><td>${e.note}</td></tr>`:''}</table>
  <a class="src" href="${e.source}" target="_blank" rel="noopener">出典を開く ↗</a>`;
  document.getElementById('ov').classList.add('show')}
function hide(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')hide()});
if(location.hash==="#cal")document.querySelector('.tab[data-v=cal]').click();else render();setInterval(()=>{if(view==='list')renderList()},60000);
</script>
</body>
